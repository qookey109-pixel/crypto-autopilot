name: Validate V0.11 Metadata Stability Evaluator

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "config/provider_equivalence_v0_11_metadata_stability_evaluation_v0_1.json"
      - "config/provider_equivalence_v0_11_synthetic_failure_rehearsal_v0_1.json"
      - "config/provider_equivalence_v0_11_post_window_execution_package_v0_1.json"
      - "config/provider_equivalence_v0_11_production_evaluation_authority_template_v0_1.json"
      - "docs/V0_11_PRODUCTION_EVALUATION_AUTHORITY_TEMPLATE.md"
      - "research/receipts/2026-08-20-provider-equivalence-v0-11-metadata-stability-evaluator-prepared.json"
      - "research/receipts/2026-08-21-provider-equivalence-v0-11-synthetic-failure-rehearsal-pass.json"
      - "research/receipts/2026-08-21-provider-equivalence-v0-11-production-evaluation-authority-template-prepared.json"
      - "research/receipts/2026-08-21-v0-10-render-final-pre-window-readonly-recheck.json"
      - "src/crypto_autopilot/provider_metadata_stability_v0_11.py"
      - "scripts/run_v0_11_synthetic_failure_rehearsal.py"
      - "tests/test_provider_metadata_stability_v0_11.py"
      - "tests/test_provider_metadata_stability_prepared_receipt_v0_11.py"
      - "tests/test_v0_11_synthetic_failure_rehearsal.py"
      - "tests/test_v0_11_post_window_execution_package.py"
      - "tests/test_v0_11_production_evaluation_authority_template.py"
      - "tests/test_pre_window_final_lineage_receipts.py"
      - "tests/test_ci_dependency_constraints.py"
      - ".github/workflows/validate-v0-11-metadata-stability-evaluator.yml"
      - "config/provider_equivalence_v0_2_metadata_capture_v0_2.json"
      - "config/provider_equivalence_v0_10_final_atomic_cutover_v0_1.json"
      - "research/receipts/2026-08-20-provider-equivalence-v0-10-final-atomic-cutover-authority.json"
      - "requirements/ci-constraints.txt"
      - "PROJECT_STATUS.md"

permissions:
  contents: read

concurrency:
  group: provider-equivalence-v0-11-stability-evaluator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-prepared-evaluator:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Install package and pytest from frozen CI constraints
        run: |
          python -m pip install -c requirements/ci-constraints.txt -e .
          python -m pip install -c requirements/ci-constraints.txt pytest
      - name: Run V0.11 synthetic stability, future-authority, and lineage regressions
        run: |
          python -m pytest -q \
            tests/test_provider_metadata_stability_v0_11.py \
            tests/test_provider_metadata_stability_prepared_receipt_v0_11.py \
            tests/test_v0_11_synthetic_failure_rehearsal.py \
            tests/test_v0_11_post_window_execution_package.py \
            tests/test_v0_11_production_evaluation_authority_template.py \
            tests/test_pre_window_final_lineage_receipts.py \
            tests/test_final_atomic_cutover_v0_10.py \
            tests/test_project_authority_hygiene_v0_8.py
      - name: Run explicit V0.11 synthetic failure rehearsal matrix
        run: |
          python scripts/run_v0_11_synthetic_failure_rehearsal.py \
            --output artifacts/v0-11-synthetic-failure-rehearsal.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: v0-11-synthetic-failure-rehearsal-${{ github.run_id }}
          path: artifacts/v0-11-synthetic-failure-rehearsal.json
          retention-days: 30
          if-no-files-found: error
      - name: Assert evaluator and future authority template remain non-executing
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          cfg = json.loads(Path('config/provider_equivalence_v0_11_metadata_stability_evaluation_v0_1.json').read_text())
          rehearsal = json.loads(Path('config/provider_equivalence_v0_11_synthetic_failure_rehearsal_v0_1.json').read_text())
          package = json.loads(Path('config/provider_equivalence_v0_11_post_window_execution_package_v0_1.json').read_text())
          authority_template = json.loads(Path('config/provider_equivalence_v0_11_production_evaluation_authority_template_v0_1.json').read_text())
          template_receipt = json.loads(Path('research/receipts/2026-08-21-provider-equivalence-v0-11-production-evaluation-authority-template-prepared.json').read_text())
          render_recheck = json.loads(Path('research/receipts/2026-08-21-v0-10-render-final-pre-window-readonly-recheck.json').read_text())
          runtime = Path('src/crypto_autopilot/provider_metadata_stability_v0_11.py').read_text()
          workflow = Path('.github/workflows/validate-v0-11-metadata-stability-evaluator.yml').read_text()

          assert cfg['status'] == 'EVALUATOR_PROTOCOL_FROZEN_EXECUTION_NOT_AUTHORIZED'
          assert cfg['frozen_scope']['expected_hourly_slot_count'] == 194
          assert cfg['frozen_scope']['replacement_holdout_state'] == 'FROZEN_UNOPENED'
          assert cfg['execution_boundary']['production_r2_evaluation_execution_authorized_by_this_protocol'] is False
          assert cfg['execution_boundary']['r2_client_construction_authorized_by_this_protocol'] is False
          assert cfg['execution_boundary']['r2_receipt_reads_authorized_by_this_protocol'] is False
          assert cfg['execution_boundary']['holdout_candle_access_authorized'] is False
          assert cfg['execution_boundary']['holdout_evaluation_authorized'] is False
          assert cfg['execution_boundary']['source_switch_authorized'] is False
          assert cfg['execution_boundary']['live_trading_authorized'] is False
          assert cfg['workflow_boundary']['scheduled_evaluation_enabled'] is False
          assert cfg['workflow_boundary']['automatic_post_window_evaluation_enabled'] is False
          assert cfg['workflow_boundary']['workflow_dispatch_production_evaluation_enabled'] is False
          assert rehearsal['execution_boundary']['synthetic_fixtures_only'] is True
          assert rehearsal['execution_boundary']['production_metadata_evidence_consumed'] is False
          assert rehearsal['execution_boundary']['r2_reads_authorized'] is False
          assert rehearsal['execution_boundary']['provider_requests_authorized'] is False
          assert rehearsal['execution_boundary']['holdout_candle_access_authorized'] is False
          assert rehearsal['required_synthetic_scenario_count'] == 12
          assert package['status'] == 'POST_WINDOW_EXECUTION_PACKAGE_PREPARED_EXECUTION_NOT_AUTHORIZED'
          assert package['current_execution_boundary']['package_is_execution_authority'] is False
          assert package['current_execution_boundary']['v0_11_production_r2_evaluation_authorized'] is False
          assert package['current_execution_boundary']['r2_client_construction_authorized'] is False
          assert package['current_execution_boundary']['r2_receipt_reads_authorized'] is False
          assert package['current_execution_boundary']['holdout_candle_access_authorized'] is False
          assert package['current_execution_boundary']['source_switch_authorized'] is False
          assert package['current_execution_boundary']['live_trading_authorized'] is False
          assert authority_template['status'] == 'TEMPLATE_PREPARED_EXECUTION_NOT_AUTHORIZED'
          assert authority_template['creation_gate']['actual_authority_may_be_created_before_window_end'] is False
          assert authority_template['creation_gate']['r2_client_may_be_constructed_before_actual_authority_merge'] is False
          assert authority_template['atomic_future_execution_change']['must_not_enable_scheduled_or_automatic_evaluation'] is True
          assert authority_template['atomic_future_execution_change']['metadata_relay_token_must_not_be_bound'] is True
          assert all(value is False for value in authority_template['current_boundary'].values())
          assert all(value is False for value in authority_template['must_remain_false_in_future_execution_authority'].values())
          assert template_receipt['status'] == 'PASS'
          assert template_receipt['source_pr'] == 161
          assert all(value is False for value in template_receipt['current_authorization_boundary'].values())
          assert render_recheck['status'] == 'PASS'
          assert render_recheck['service']['auto_deploy'] is False
          assert render_recheck['service']['auto_deploy_trigger'] == 'off'
          assert render_recheck['live_deploy']['commit_sha'] == '8fce944da479dbda0e2899f9b30b9de62351fa27'
          assert render_recheck['live_deploy']['unexpected_redeploy_after_v0_10_activation'] is False
          assert 'V0_11_R2_EVALUATION_EXECUTION_AUTHORIZED = False' in runtime
          assert not any(line == '  schedule:' for line in workflow.splitlines())
          expression_prefix = '$' + '{{ secrets.'
          for secret in ('R2_ACCESS_KEY_ID', 'R2_SECRET_ACCESS_KEY', 'CLOUDFLARE_ACCOUNT_ID', 'R2_BUCKET_NAME', 'METADATA_RELAY_TOKEN'):
              assert expression_prefix + secret not in workflow
          PY
      - name: Prove prepared production entrypoint stops before R2 construction
        run: |
          python - <<'PY'
          from crypto_autopilot import provider_metadata_stability_v0_11 as v11

          called = False
          def forbidden_store():
              global called
              called = True
              raise AssertionError('prepared V0.11 evaluator constructed R2')

          result = v11.run_v0_11_r2_evaluation(store_factory=forbidden_store)
          assert result['status'] == 'SKIP'
          assert result['stage'] == 'V0_11_METADATA_STABILITY_R2_EVALUATION_NOT_AUTHORIZED'
          assert result['r2_client_constructed'] is False
          assert result['r2_receipt_reads_performed'] == 0
          assert result['r2_writes_performed'] is False
          assert result['provider_requests_performed'] == 0
          assert result['render_requests_performed'] == 0
          assert result['holdout_candles_accessed'] is False
          assert result['holdout_evaluated'] is False
          assert result['source_switch_authorized'] is False
          assert result['live_trading_authorized'] is False
          assert called is False
          PY
