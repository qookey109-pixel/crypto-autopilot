name: M1B M1A Dataset Upload — RETIRED

on:
  pull_request:
    paths:
      - ".github/workflows/m1b-m1a-dataset-upload.yml"
      - "research/receipts/2026-08-18-m1b-r2.json"

permissions:
  contents: read

jobs:
  validate-retired:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Validate frozen M1B authority without upload
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          receipt = json.loads(Path('research/receipts/2026-08-18-m1b-r2.json').read_text())
          assert receipt['status'] == 'PASS'
          assert receipt['stage'] == 'M1B_COMPLETE'
          assert receipt['validation']['exact_candle_equality_after_r2_roundtrip'] is True
          print('RETIRED_NO_EXECUTION')
          print('provider_requests_performed=0')
          print('r2_writes_performed=false')
          print('holdout_candles_accessed=false')
          print('source_switch_authorized=false')
          print('live_trading_authorized=false')
          PY
