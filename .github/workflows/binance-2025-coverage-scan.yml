name: Binance 2025 Coverage Scan — RETIRED

on:
  pull_request:
    paths:
      - ".github/workflows/binance-2025-coverage-scan.yml"
      - "research/receipts/2026-08-18-binance-2025-coverage-scan.json"

permissions:
  contents: read

jobs:
  validate-retired:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Validate frozen coverage authority without provider access
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          receipt = json.loads(Path('research/receipts/2026-08-18-binance-2025-coverage-scan.json').read_text(encoding='utf-8'))
          assert receipt['status'] == 'PASS'
          assert receipt['stage'] == 'BINANCE_2025_COVERAGE_SCAN_PASS'
          assert receipt['scope']['archive_checks'] == 720
          assert receipt['validation']['r2_write_used'] is False
          assert receipt['authority_boundary']['authorizes_large_scale_backfill'] is False
          assert receipt['authority_boundary']['authorizes_live_trading'] is False
          print('RETIRED_NO_EXECUTION')
          print('provider_requests_performed=0')
          print('r2_client_constructed=false')
          print('r2_reads_performed=false')
          print('r2_writes_performed=false')
          print('holdout_candles_accessed=false')
          print('source_switch_authorized=false')
          print('live_trading_authorized=false')
          PY
