      - "config/provider_equivalence_v0_8_render_metadata_execution_cutover_v0_1.json"
      - "config/provider_equivalence_v0_10_final_atomic_cutover_v0_1.json"
      - "config/provider_equivalence_v0_12_successor_metadata_window_v0_1.json"
      - "config/provider_equivalence_v0_12_successor_metadata_window_binding_v0_1.json"
      - "research/receipts/2026-08-31-provider-equivalence-v0-12-successor-metadata-window-binding.json"
      - "config/binance_usdm_detailed_history_v0_1_2.json"
      - "config/pionex_alternative_assets_v0_1.json"
      - "config/pionex_alternative_assets_observability_v0_2.json"
      - "config/post_window_research_successor_schedule_v0_1.json"
      - "config/github_automatic_research_operations_v0_1.json"
      - "config/research_automation_health_v0_2.json"
      - "config/automation_schedule_projection_v0_1.json"
      - "config/core100_history_retirement_v0_1.json"
      - "config/core100_training_fingerprint_v0_1.json"
      - "config/github_automatic_research_operations_v0_4.json"
      - "config/github_automatic_research_operations_v0_5.json"
      - ".github/workflows/binance-usdm-detailed-history-v0-1.yml"
      - ".github/workflows/binance-usdm-detailed-training-v0-1.yml"
      - "config/resource_hub_supply_chain_v0_2.json"
      - "config/external_capability_registry_v0_1.json"
      - "config/zec_strategy_v0_3_development_matrix_v0_1.json"
      - "config/post_window_paper_training_v0_2.json"
      - "config/strategy_edge_validation_v0_1.json"
      - "config/strategy_research_loop_v0_1.json"
      - "config/strategy_parameter_sweep_v0_1.json"
      - "config/technical_analysis_v0_2.json"
      - "config/binance_spot_shadow_v0_6.json"
      - "docs/CONTINUOUS_LEARNING_ROADMAP_V0_1.md"
      - "docs/HISTORICAL_SSTATE_EVIDENCE_INGESTION_V0_1.md"
      - ".github/workflows/provider-equivalence-v0-2-metadata-capture.yml"
      - ".github/workflows/provider-equivalence-v0-10-render-metadata-capture.yml"
      - ".github/workflows/provider-equivalence-v0-12-successor-metadata-capture.yml"
      - "CURRENT_STATUS.md"
      - "PROJECT_STATUS.md"
      - "config/strategy_v0_1.json"
      - ".github/workflows/dashboard-github-pages.yml"
  pull_request:
    paths:
      - "web/**"
      - "package.json"
      - "package-lock.json"
      - "playwright.config.cjs"
      - "tests/browser/**"
      - "tests/test_dashboard_playwright_workflow_v0_1.py"
      - "scripts/build_dashboard_authority_snapshot.py"
      - "scripts/build_research_calendar_projection.py"
      - "scripts/build_automation_schedule_projection.py"
      - "scripts/build_dashboard_content_hash.py"
      - "scripts/check_dashboard_deploy_freshness.py"
      - "scripts/build_alternative_assets_projection.py"
      - "scripts/build_strategy_projection.py"
      - "scripts/apply_dashboard_latest_authority.py"
      - "scripts/apply_dashboard_current_operations_v0_3.py"
      - "scripts/build_cloud_run_status.py"
      - "scripts/build_delivery_overview.py"
      - "research/status/simulation-readiness-v0-1.json"
      - "research/status/current-operations-v0-3.json"
      - "scripts/validate_dashboard_static.py"
      - "research/receipts/**"
      - "config/provider_equivalence_v0_7_render_metadata_capture_protocol_v0_1.json"
      - "config/provider_equivalence_v0_8_render_metadata_execution_cutover_v0_1.json"
      - "config/provider_equivalence_v0_10_final_atomic_cutover_v0_1.json"
      - "config/provider_equivalence_v0_12_successor_metadata_window_v0_1.json"
      - "config/provider_equivalence_v0_12_successor_metadata_window_binding_v0_1.json"
      - "research/receipts/2026-08-31-provider-equivalence-v0-12-successor-metadata-window-binding.json"
      - "config/binance_usdm_detailed_history_v0_1_2.json"
      - "config/pionex_alternative_assets_v0_1.json"
      - "config/pionex_alternative_assets_observability_v0_2.json"
      - "config/post_window_research_successor_schedule_v0_1.json"
      - "config/github_automatic_research_operations_v0_1.json"
      - "config/research_automation_health_v0_2.json"
      - "config/automation_schedule_projection_v0_1.json"
      - "config/core100_history_retirement_v0_1.json"
      - "config/core100_training_fingerprint_v0_1.json"
      - "config/github_automatic_research_operations_v0_4.json"
      - "config/github_automatic_research_operations_v0_5.json"
      - ".github/workflows/binance-usdm-detailed-history-v0-1.yml"
      - ".github/workflows/binance-usdm-detailed-training-v0-1.yml"
      - "config/resource_hub_supply_chain_v0_2.json"
      - "config/external_capability_registry_v0_1.json"
      - "config/zec_strategy_v0_3_development_matrix_v0_1.json"
      - "config/post_window_paper_training_v0_2.json"
      - "config/strategy_edge_validation_v0_1.json"
      - "config/strategy_research_loop_v0_1.json"
      - "config/strategy_parameter_sweep_v0_1.json"
      - "config/technical_analysis_v0_2.json"
      - "config/binance_spot_shadow_v0_6.json"
      - "docs/CONTINUOUS_LEARNING_ROADMAP_V0_1.md"
      - "docs/HISTORICAL_SSTATE_EVIDENCE_INGESTION_V0_1.md"
      - ".github/workflows/provider-equivalence-v0-2-metadata-capture.yml"
      - ".github/workflows/provider-equivalence-v0-10-render-metadata-capture.yml"
      - ".github/workflows/provider-equivalence-v0-12-successor-metadata-capture.yml"
      - "CURRENT_STATUS.md"
      - "PROJECT_STATUS.md"
      - "config/strategy_v0_1.json"
      - ".github/workflows/dashboard-github-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'production' }}
  # Keep the daily schedule and event-driven runs, including pending runs, in order.
  # The shared production group also serializes build, deployment, and browser checks.
  queue: max
  cancel-in-progress: false

jobs:
  build:
    outputs:
      deploy_required: ${{ steps.content-hash.outputs.deploy_required }}
      content_hash: ${{ steps.content-hash.outputs.content_hash }}
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       (github.event.workflow_run.event == 'schedule' ||
        github.event.workflow_run.event == 'workflow_dispatch' ||
        (github.event.workflow_run.event == 'workflow_run' &&
         github.event.workflow_run.name == 'Research Signal Quality V0.1')))
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Validate dashboard JavaScript and paper empty states
        run: |
          node --check web/assets/js/app.js
          node --check web/assets/js/current-operations.js
          node scripts/test_dashboard_cloud_runs.cjs
          node --test tests/dashboard_paper_readiness.test.cjs

      - name: Validate Traditional Chinese dashboard safety
        run: python scripts/validate_dashboard_static.py

      - name: Build historical authorities then current operations projection
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/data
          cp -R web/. _site/
          python scripts/build_delivery_overview.py --site _site
          python scripts/build_strategy_projection.py \
            --output _site/data/strategy.json
          python scripts/build_dashboard_authority_snapshot.py \
            --output _site/data/dashboard.json
          python scripts/build_research_calendar_projection.py \
            --output _site/data/research-calendar.json
          PYTHONPATH=src python scripts/build_automation_schedule_projection.py \
            --output _site/data/operations-schedule.json
          PYTHONPATH=src python scripts/build_alternative_assets_projection.py \
            --output _site/data/alternative-assets.json
          python scripts/apply_dashboard_latest_authority.py \
            --input _site/data/dashboard.json \
            --output _site/data/dashboard.json
          python scripts/apply_dashboard_current_operations_v0_3.py \
            --input _site/data/dashboard.json \
            --output _site/data/dashboard.json
          touch _site/.nojekyll

      - name: Refresh cloud execution status from GitHub metadata only
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/build_cloud_run_status.py --output _site/data/cloud-runs.json

      - name: Assert current operations and historical authority boundaries
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from datetime import datetime
          from pathlib import Path

          data = json.loads(Path('_site/data/dashboard.json').read_text(encoding='utf-8'))
          calendar = json.loads(Path('_site/data/research-calendar.json').read_text(encoding='utf-8'))
          operations = json.loads(Path('_site/data/operations-schedule.json').read_text(encoding='utf-8'))
          evidence = json.loads(Path('_site/data/research-evidence.json').read_text(encoding='utf-8'))
          strategy = json.loads(Path('_site/data/strategy.json').read_text(encoding='utf-8'))
          alternative = json.loads(Path('_site/data/alternative-assets.json').read_text(encoding='utf-8'))
          current_web = json.loads(Path('_site/data/current-operations.json').read_text(encoding='utf-8'))
          automation_health = json.loads(Path('config/research_automation_health_v0_2.json').read_text(encoding='utf-8'))
          project = data['project']

          assert data['authority'] is False
          assert data['locale'] == 'zh-Hant-TW'
          assert data['schema'] == 'qookey-dashboard-authority-snapshot-v0.13'

          # Frozen historical authority lineage remains intact.
          assert project['fundingMaterializationComplete'] is True
          assert project['fundingMaterializationState'] == 'PASS'
          assert project['fundingV0_2R2Identities'] == 192
          assert project['fundingV0_2UploadedObjectCount'] == 192
          assert project['r2BucketObjectCount'] == 457
          assert project['r2BucketBytes'] == 22120404
          assert project['providerEquivalenceGateState'] == 'FAIL'
          assert (
              project['providerEquivalencePassCount'],
              project['providerEquivalenceReviewCount'],
              project['providerEquivalenceFailCount'],
          ) == (18, 18, 9)
          assert project['renderTransportV0_5State'] == 'PASS'
          assert project['renderTransportV0_6AuthorityState'] == 'PASS'
          assert project['renderMetadataV0_8SharedSecretState'] == 'PASS_FROZEN'
          assert project['renderMetadataV0_9SmokeState'] == 'PASS_FROZEN'
          assert project['renderMetadataV0_10CutoverState'] == 'EFFECTIVE_AUTHORIZED'
          assert project['v0_10PerpQueryMergeSha'] == 'a34cf471876971a97200de4974906743642ed61f'
          assert project['v0_10CaptureOperationalState'] == 'RETIRED_AFTER_FAIL_CLOSED_PIONEX_SCHEMA_MISMATCH'
          assert project['v0_10CaptureObservedFailedRunCount'] == 6
          assert project['v0_10CaptureLatestObservedRunId'] == 33366572161
          assert project['oldV0_2ScheduledExecutionAuthorized'] is False
          assert project['v0_10ScheduledExecutionAuthorized'] is False
          assert project['metadataCapturePathsConcurrentAuthorized'] is False
          assert project['metadataStabilityState'] == 'NOT_YET_RUN'
          assert project['metadataStabilityEligibilityState'] == 'V0_10_BLOCKED_V0_12_NOT_YET_RUN'
          assert project['cloudRuntimeMonthlyBudgetUsd'] == 0

          # Present-tense operational projection comes from Current Operations V0.3.
          assert project['currentOperationsEvidenceBasisIsLatestMainClaim'] is False
          assert project['currentOperationsEvidenceBasisSemantics'] == (
              'REPOSITORY_MAIN_REVIEWED_BEFORE_THIS_STATUS_VERSION'
          )
          assert project['core100HistoryState'] == 'COMPLETE_10_OF_10'
          assert project['core100TrainingState'] == 'COMPLETED_PASS'
          assert project['core100TrainingRunId'] == 34918219864
          assert project['core100ModelQualityState'] == 'REJECT'
          assert project['core100ThresholdReplayState'] == (
              'COMPLETED_NO_SUPPORTED_THRESHOLD_CHANGE'
          )
          assert project['core100ThresholdReplayRunId'] == 34936331199
          assert project['core100ThresholdChangeSupported'] is False
          assert project['pionexValidationMaterializationState'] == 'COMPLETE_PASS'
          assert project['pionexValidationMaterializationRunId'] == 35054729471
          assert project['pionexValidationSelectedMarkets'] == 197
          assert project['pionexValidationPartitions'] == 682
          assert project['pionexValidationManualDispatchOnly'] is True
          assert project['currentMetadataCaptureExecutionPath'] == 'NONE_V0_12_WINDOW_ENDED'
          assert project['v0_12SuccessorWindowState'] == 'HISTORICAL_WINDOW_ENDED'
          assert project['v0_12CurrentWindowActive'] is False
          assert project['v0_12ScheduleRegistrationPresent'] is True
          assert project['successorMetadataCaptureExecutionAuthorized'] is False
          assert project['successorMetadataScheduleEnabled'] is False
          assert project['replacementHoldoutState'] == 'FROZEN_UNOPENED'
          assert project['sourceSwitchAuthorized'] is False
          assert project['tradePlanAuthorized'] is False
          assert project['publicLiveMarketDataAuthorized'] is True
          assert project['livePaperSimulationAuthorized'] is True
          assert project['paperStatePersistenceAuthorized'] is True
          assert project['liveTradingAuthorized'] is False
          assert project['liveRealTradingAuthorized'] is False

          assert project['githubAutomaticOperationsState'] == 'AUTHORIZED_ON_MAIN_MERGE'
          assert project['githubAutomaticScheduledWorkflowCount'] == len(automation_health['workflows'])
          assert project['githubManualDispatchRequiredForNormalOperations'] is False
          assert project['githubManualRunsCountAsAutomationHealth'] is False
          assert project['strategyResearchLoopState'] == 'PREPARED_RESEARCH_ONLY'
          assert project['strategyResearchCandidateCount'] == 120
          assert project['strategyResearchFamilyCount'] == 4
          assert project['strategyResearchHorizonCount'] == 3
          assert project['strategyEdgeValidationState'] == 'PREPARED_RESEARCH_ONLY'
          assert project['strategyEdgeMethodCount'] == 6
          assert project['strategyResearchExecutionAuthorized'] is False
          assert project['strategyModelPromotionAuthority'] == 0
          assert project['mode'] == 'PAPER / LIVE-PAPER ONLY'

          datetime.fromisoformat(data['generatedAtUtc'].replace('Z', '+00:00'))
          assert calendar['authority'] is False
          assert calendar['safetyBoundary']['backtestAdmissionAuthorized'] is False
          datetime.fromisoformat(calendar['projectionGeneratedAtUtc'].replace('Z', '+00:00'))
          assert operations['authority'] is False
          assert operations['schema'] == 'qookey-automation-schedule-projection-v0.1'
          assert operations['sourceStatus']['resourceHub']['state'] == (
              'SCHEDULED_READ_ONLY_CHANGE_WATCH'
          )
          assert operations['sourceStatus']['externalCapabilityRegistry']['candidateCount'] == 10
          assert operations['summary']['scheduledJobCount'] == 7
          assert operations['summary']['core100HistoryRetirementPending'] is False
          assert operations['summary']['core100HistoryScheduleRetired'] is True
          assert operations['summary']['core100TrainingDedupeState'] == 'ACTIVE_FINGERPRINT_NO_CHANGE'
          assert operations['sourceStatus']['core100']['historyState'] == 'COMPLETE_SCHEDULE_RETIRED'
          assert operations['sourceStatus']['core100']['trainingState'] == 'FINGERPRINT_DEDUP_ACTIVE'
          assert operations['sourceStatus']['core100']['trainingNoChangeWritesR2'] is False
          assert operations['sourceStatus']['zecV0_3']['expectedCells'] == 256
          assert operations['sourceStatus']['zecV0_3']['completedCells'] == 256
          assert operations['sourceStatus']['zecV0_3']['state'] == (
              'COMPLETE_NO_ELIGIBLE_DEVELOPMENT_CANDIDATE'
          )
          assert operations['sourceStatus']['zecV0_3']['selectionStatus'] == (
              'NO_ELIGIBLE_DEVELOPMENT_CANDIDATE'
          )
          assert operations['sourceStatus']['zecV0_3']['championFrozen'] is False
          assert operations['sourceStatus']['zecV0_3']['diagnosticLeaderId'] == 'zec-v0-3-45'
          assert operations['sourceStatus']['zecV0_3']['freshConfirmationAccessAuthorized'] is False
          assert all(value is False for value in operations['safetyBoundary'].values())
          datetime.fromisoformat(operations['projectionGeneratedAtUtc'].replace('Z', '+00:00'))
          assert evidence['authority'] is False
          assert evidence['positions'] == []
          assert evidence['backtests'] == []
          assert evidence['safetyBoundary']['backtestAdmissionAuthorized'] is False
          assert strategy['schema'] == 'qookey-dashboard-strategy-projection-v0.1'
          assert strategy['authority'] is False
          assert strategy['baseline']['mode'] == 'paper'
          assert strategy['summary']['candidateCount'] == 120
          assert strategy['summary']['edgeMethodCount'] == 6
          assert all(value is False for value in strategy['safetyBoundary'].values())
          assert alternative['schema'] == 'qookey-pionex-alternative-assets-projection-v0.2'
          assert alternative['authority'] is False
          assert alternative['mode'] == 'METADATA_ONLY_READ_ONLY'
          assert alternative['status'] == 'WAITING_FIRST_RUN'
          assert alternative['candidate_registry']['total'] == 125
          assert alternative['actual_catalog'] is None
          assert alternative['capacity_candidate_max']['total_rows'] == 23010750
          assert alternative['capacity_candidate_max']['historical_materialization_authorized'] is False
          assert all(value is False for value in alternative['safety_boundary'].values())

          schema = json.loads(Path('_site/data/research-evidence.schema.json').read_text(encoding='utf-8'))
          assert schema['properties']['authority']['const'] is False
          assert Path('_site/assets/css/styles.css').is_file()
          assert Path('_site/assets/js/app.js').is_file()
          assert Path('_site/assets/js/current-operations.js').is_file()
          assert Path('_site/assets/images/cloud-garden-v4.jpg').is_file()

          security = data['securityBoundary']
          assert security['containsSecrets'] is False
          assert security['authorizesMetadataCapture'] is False
          assert security['authorizesPionexValidationMaterialization'] is True
          assert security['authorizesPionexPrivateApi'] is False
          assert security['authorizesHoldoutAccess'] is False
          assert security['authorizesSourceSwitch'] is False
          assert security['authorizesTradePlans'] is False
          assert security['authorizesLivePaperSimulation'] is True
          assert security['authorizesPaperStatePersistence'] is True
          assert security['authorizesLiveTrading'] is False

          assert current_web['schema'] == 'qookey-current-operations-web-v0.3'
          assert current_web['authority'] is False
          assert current_web['historyStatus'] == 'COMPLETE'
          assert current_web['historyCompleteShards'] == 10
          assert current_web['trainingStatus'] == 'COMPLETED_PASS'
          assert current_web['modelQualityStatus'] == 'REJECT'
          assert current_web['thresholdChangeSupported'] is False
          assert current_web['pionexValidationStatus'] == 'COMPLETE_PASS'
          assert current_web['pionexMaterializationRunId'] == 35054729471
          assert current_web['evidenceBasisIsLatestMainClaim'] is False

          html = Path('_site/index.html').read_text(encoding='utf-8')
          assert f"{current_web['updatedDate']} 目前作業狀態" in html
          assert '10/10 · COMPLETE' in html
          assert 'COMPLETED · PASS' in html
          assert 'COMPLETE · PASS' in html
          assert 'PENDING MANUAL DISPATCH' not in html
          assert '8/10 分片' not in html
          assert '訓練尚未完成' not in html
          assert 'PR #292' not in html
          assert 'current-operations.js?v=current-ops-v0-4' in html
          PY

      - name: Build and compare business content hash
        id: content-hash
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_dashboard_content_hash.py \
            --site _site \
            --output _site/data/content-hash.txt \
            --manifest _site/data/content-manifest.json
          deploy_required=true
          local_hash="$(tr -d '\r\n' < _site/data/content-hash.txt)"
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            remote_hash="$(
              curl --fail --silent --show-error \
                "https://qookey109-pixel.github.io/crypto-autopilot/data/content-hash.txt" \
                2>/dev/null || true
            )"
            if [[ -n "${remote_hash}" && "${remote_hash}" == "${local_hash}" ]]; then
              deploy_required=false
            fi
          fi
          echo "deploy_required=${deploy_required}" >> "${GITHUB_OUTPUT}"
          echo "content_hash=${local_hash}" >> "${GITHUB_OUTPUT}"

      - name: Set up Node for PR browser validation
        if: github.event_name == 'pull_request'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"

      - name: Install pinned Playwright for PR browser validation
        if: github.event_name == 'pull_request'
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Start built dashboard server for PR browser validation
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server 4173 -d _site > /tmp/qookey-dashboard-playwright.log 2>&1 &
          echo $! > /tmp/qookey-dashboard-playwright.pid
          for attempt in $(seq 1 20); do
            if curl --fail --silent "http://127.0.0.1:4173/" >/dev/null; then
              exit 0
            fi
            if [[ "${attempt}" -eq 20 ]]; then
              break
            fi
            sleep 0.25
          done
          cat /tmp/qookey-dashboard-playwright.log || true
          exit 1

      - name: Browser validate built dashboard on desktop and mobile
        if: github.event_name == 'pull_request'
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173/
          PLAYWRIGHT_EXPECTED_CONTENT_HASH: ${{ steps.content-hash.outputs.content_hash }}
        run: npx playwright test --workers=1

      - name: Stop PR browser validation server
        if: always() && github.event_name == 'pull_request'
        shell: bash
        run: |
          if test -f /tmp/qookey-dashboard-playwright.pid; then
            kill "$(cat /tmp/qookey-dashboard-playwright.pid)" || true
          fi

      - name: Upload PR Playwright failure evidence
        if: failure() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dashboard-playwright-pr-${{ github.run_id }}
          path: playwright-results
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload PR build evidence
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dashboard-pages-build-${{ github.run_id }}
          path: _site
          retention-days: 3
          if-no-files-found: error

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request' && steps.content-hash.outputs.deploy_required == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && needs.build.outputs.deploy_required == 'true'
    needs: build
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
      deployed: ${{ steps.deployment.outcome == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Reject stale main or unchanged content before deployment
        id: freshness
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.sha }}
          CONTENT_HASH: ${{ needs.build.outputs.content_hash }}
        run: >-
          python scripts/check_dashboard_deploy_freshness.py
          --repository "${GITHUB_REPOSITORY}"
          --expected-sha "${EXPECTED_SHA}"
          --content-hash "${CONTENT_HASH}"
          --github-output "${GITHUB_OUTPUT}"

      - name: Configure GitHub Pages
        if: steps.freshness.outputs.deploy_required == 'true'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Deploy to GitHub Pages
        if: steps.freshness.outputs.deploy_required == 'true'
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5

  browser-production:
    if: needs.deploy.outputs.deployed == 'true'
    needs: [build, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"

      - name: Install pinned Playwright production validator
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Wait for deployed GitHub Pages site
        env:
          PLAYWRIGHT_BASE_URL: ${{ needs.deploy.outputs.page_url }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error "${PLAYWRIGHT_BASE_URL}" >/dev/null; then
              exit 0
            fi
            if [[ "${attempt}" -eq 30 ]]; then
              break
            fi
            sleep 2
          done
          echo "deployed Pages URL did not become readable"
          exit 1

      - name: Browser validate deployed dashboard on desktop and mobile
        env:
          PLAYWRIGHT_BASE_URL: ${{ needs.deploy.outputs.page_url }}
          PLAYWRIGHT_EXPECTED_CONTENT_HASH: ${{ needs.build.outputs.content_hash }}
        run: npx playwright test --workers=1

      - name: Upload production Playwright failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dashboard-playwright-production-${{ github.run_id }}
          path: playwright-results
          retention-days: 7
          if-no-files-found: ignore
