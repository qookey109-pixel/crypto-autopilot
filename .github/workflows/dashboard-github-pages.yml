name: Dashboard GitHub Pages

on:
  schedule:
    - cron: "43 4 * * *"
  workflow_run:
    workflows:
      - "Pionex Historical Reach Discovery V0.3"
      - "Pionex Research Universe 150+ V0.1"
      - "Pionex Funding History V0.1"
      - "Binance USD-M Crypto Core 100 Training V0.1.2"
      - "Pionex Alternative Assets Observability V0.2"
      - "Research Automation Health V0.2"
      - "Research Signal Layer V0.2"
      - "Research Signal Quality V0.1"
      - "Resource Hub Supply Chain V0.2"
      - "Live Paper Run Coordinator V0.1"
    types: [completed]
  push:
    branches: [main]
    paths:
