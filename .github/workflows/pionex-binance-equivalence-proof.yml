name: Pionex Binance Equivalence Proof — RETIRED

on:
  pull_request:
    paths:
      - ".github/workflows/pionex-binance-equivalence-proof.yml"
      - "research/receipts/2026-08-19-pionex-binance-equivalence-v0-1.json"

permissions:
  contents: read

jobs:
  validate-retired:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Validate frozen V0.1 gate FAIL without source replay
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          receipt = json.loads(Path('research/receipts/2026-08-19-pionex-binance-equivalence-v0-1.json').read_text(encoding='utf-8'))
          assert receipt['status'] == 'FAIL'
          assert receipt['stage'] == 'PIONEX_BINANCE_EQUIVALENCE_GATE_FAIL'
          assert receipt['authority_type'] == 'FROZEN_PROVIDER_EQUIVALENCE_GATE_RESULT'
          aggregate = receipt['aggregate']
          assert aggregate['gate_status'] == 'FAIL'
          assert (aggregate['evaluated_pair_count'], aggregate['pass_count'], aggregate['review_count'], aggregate['fail_count']) == (45, 18, 18, 9)
          assert aggregate['source_switch_authorized'] is False
          boundary = receipt['authority_boundary']
          assert boundary['staged_trade_kline_w1_materialization_authorized'] is False
          assert boundary['backtest_admission_authorized'] is False
          assert boundary['live_trading_authorized'] is False
          print('RETIRED_NO_EXECUTION')
          print('provider_requests_performed=0')
          print('r2_client_constructed=false')
          print('r2_reads_performed=false')
          print('r2_writes_performed=false')
          print('holdout_candles_accessed=false')
          print('source_switch_authorized=false')
          print('live_trading_authorized=false')
          PY
