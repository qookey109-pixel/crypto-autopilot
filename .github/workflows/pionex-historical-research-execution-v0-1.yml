name: Pionex Historical Research Pilot Execution V0.1

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pionex-historical-research-pilot-execution-v0-1
  cancel-in-progress: false

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Install constrained runtime
        run: python -m pip install -c requirements/ci-constraints.txt .

      - name: Run one-shot Pionex-native history pilot
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          python scripts/run_pionex_historical_research_execution_v0_1.py \
            --config config/pionex_historical_research_execution_v0_1.json \
            --prepared-config config/pionex_historical_research_pool_v0_1.json \
            --authority research/receipts/2026-09-10-pionex-historical-research-execution-v0-1-authority.json \
            --run-id "github-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --output pionex-history-pilot-output/report.json

      - name: Assert paper-only pilot boundary
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("pionex-history-pilot-output/report.json").read_text())
          assert report["status"] in {"PASS", "ALREADY_COMPLETE", "FAIL"}
          assert report["holdout_accessed"] is False
          assert report["live_trading_authorized"] is False
          assert report["r2_writes_performed"] in {True, False}
          if report["status"] == "PASS":
              assert report["r2_latest_pointer_written_last"] is True
              assert report["training_authorized"] is False
              assert report["source_switch_authorized"] is False
              assert report["binance_relabel_as_pionex_authorized"] is False
          PY

      - name: Upload secret-free pilot report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pionex-historical-research-pilot-${{ github.run_id }}-${{ github.run_attempt }}
          path: pionex-history-pilot-output/report.json
          retention-days: 90
          if-no-files-found: error

      - name: Remove disposable runner output
        if: always()
        run: rm -rf pionex-history-pilot-output
