name: Pionex Public Paper Training V0.1

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages-production
  cancel-in-progress: true

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Install constrained runtime
        run: python -m pip install -c requirements/ci-constraints.txt .

      - name: Restore secret-free forward state
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: paper-training-state
          key: paper-training-state-v0-1-${{ github.run_id }}
          restore-keys: |
            paper-training-state-v0-1-

      - name: Run bounded public-data paper training
        run: |
          python scripts/run_pionex_paper_training.py \
            --config config/paper_training_v0_1.json \
            --output paper-training-output/paper-training.json \
            --state paper-training-state/state.json \
            --run-id "github-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

      - name: Assert paper-only and holdout boundaries
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("paper-training-output/paper-training.json").read_text())
          assert report["mode"] == "PAPER_TRAINING_ONLY"
          authority = report["authority"]
          assert authority.get("holdoutAccessed", False) is False
          assert authority.get("pionexDemoAutomationAuthorized", False) is False
          assert authority.get("privateApiUsed", False) is False
          assert authority.get("realMoneyOrderAuthorized", False) is False
          assert authority.get("liveTradingAuthorized", False) is False
          PY

      - name: Upload run-scoped training evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pionex-paper-training-${{ github.run_id }}-${{ github.run_attempt }}
          path: paper-training-output/paper-training.json
          retention-days: 90
          if-no-files-found: error

      - name: Build read-only Pages projection
        run: |
          rm -rf _site
          mkdir -p _site/data
          cp -R web/. _site/
          python scripts/build_dashboard_authority_snapshot.py \
            --output _site/data/dashboard.json
          python scripts/apply_dashboard_latest_authority.py \
            --input _site/data/dashboard.json \
            --output _site/data/dashboard.json
          cp paper-training-output/paper-training.json _site/data/paper-training.json
          touch _site/.nojekyll

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: _site

  deploy:
    needs: train
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Deploy read-only paper-training dashboard
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
