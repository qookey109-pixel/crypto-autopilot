name: Validate V0.9 Render Relay Smoke — Frozen PASS Regression

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "config/provider_equivalence_v0_9_render_relay_smoke_v0_1.json"
      - "research/receipts/2026-08-20-provider-equivalence-v0-9-render-relay-smoke-pass.json"
      - "infra/render/binance-transport-free/server.py"
      - "tests/test_render_relay_smoke_v0_9.py"
      - "tests/test_render_relay_smoke_pass_v0_9.py"
      - ".github/workflows/validate-v0-9-render-relay-smoke.yml"
      - ".github/workflows/provider-equivalence-v0-2-metadata-capture.yml"
      - ".github/workflows/provider-equivalence-v0-10-render-metadata-capture.yml"
      - ".github/workflows/provider-equivalence-v0-12-successor-metadata-capture.yml"
      - "config/provider_equivalence_v0_12_successor_metadata_window_v0_1.json"
      - "config/provider_equivalence_v0_10_final_atomic_cutover_v0_1.json"

permissions:
  contents: read

jobs:
  frozen-pass-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install pytest
        run: python -m pip install pytest
      - name: Validate frozen V0.9 smoke authority and HTTP boundaries locally
        run: |
          python -m pytest -q \
            tests/test_render_relay_smoke_v0_9.py \
            tests/test_render_relay_smoke_pass_v0_9.py \
            tests/test_render_shared_secret_preflight_v0_8.py \
            tests/test_render_metadata_capture_protocol_v0_7.py
      - name: Assert V0.9 evidence stays frozen while V0.12 owns current schedule
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          server = Path('infra/render/binance-transport-free/server.py').read_text()
          successor = Path('src/crypto_autopilot/provider_metadata_capture_v0_8_successor.py').read_text()
          v08_workflow = Path('.github/workflows/provider-equivalence-v0-8-render-metadata-capture.yml').read_text().splitlines()
          old = Path('.github/workflows/provider-equivalence-v0-2-metadata-capture.yml').read_text().splitlines()
          new = Path('.github/workflows/provider-equivalence-v0-10-render-metadata-capture.yml').read_text().splitlines()
          current = Path('.github/workflows/provider-equivalence-v0-12-successor-metadata-capture.yml').read_text().splitlines()
          smoke = json.loads(Path('research/receipts/2026-08-20-provider-equivalence-v0-9-render-relay-smoke-pass.json').read_text())
          cutover = json.loads(Path('config/provider_equivalence_v0_10_final_atomic_cutover_v0_1.json').read_text())

          assert smoke['status'] == 'PASS'
          assert smoke['result']['upstream_status'] == 200
          assert smoke['result']['symbol_count'] == 872
          assert smoke['result']['provider_requests_performed'] == 1
          assert smoke['result']['r2_writes_performed'] is False
          assert smoke['result']['holdout_candles_accessed'] is False
          assert 'V0_9_RELAY_SMOKE_EXECUTION_AUTHORIZED = True' in server
          assert 'METADATA_RELAY_EXECUTION_AUTHORIZED = False' in server
          assert 'SUCCESSOR_RUNTIME_EXECUTION_AUTHORIZED = False' in successor
          assert not any(line == '  schedule:' for line in v08_workflow)
          assert not any(line == '  schedule:' for line in old)
          assert not any(line == '  schedule:' for line in new)
          assert any(line == '  schedule:' for line in current)
          assert cutover['atomic_repository_cutover']['old_schedule_removed_in_same_change'] is True
          assert cutover['atomic_repository_cutover']['successor_schedule_enabled_in_same_change'] is True
          assert cutover['atomic_repository_cutover']['concurrent_old_and_new_capture_paths_authorized'] is False
          PY

      - name: Record frozen regression-only state
        run: |
          echo 'V0.9 live smoke PASS is frozen; this workflow performs no provider request.'
          echo 'provider_requests_performed=0'
          echo 'r2_writes_performed=false'
          echo 'holdout_candles_accessed=false'
