name: Binance Funding Materialization Plan V0.2

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/binance-funding-materialization-plan-v0-2.yml"
      - "config/binance_funding_materialization_authority_v0_2.json"
      - "src/crypto_autopilot/binance_funding_materialization_plan_v0_2.py"
      - "scripts/plan_binance_funding_materialization_v0_2.py"
      - "tests/test_binance_funding_materialization_plan_v0_2.py"
      - "research/receipts/2026-08-19-binance-funding-interior-continuity-review.json"
      - "research/receipts/2026-08-18-binance-funding-coverage.json"

permissions:
  contents: read

concurrency:
  group: binance-funding-materialization-plan-v0-2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install package
        run: python -m pip install -e .

      - name: Run V0.2 planner tests
        run: python -m unittest discover -s tests -p 'test_binance_funding_materialization_plan_v0_2.py' -v

      - name: Generate read-only V0.2 materialization plan
        run: |
          python scripts/plan_binance_funding_materialization_v0_2.py \
            --config config/binance_funding_materialization_authority_v0_2.json \
            --output artifacts/binance-funding-materialization-plan-v0-2.json

      - name: Upload V0.2 planning evidence
        uses: actions/upload-artifact@v4
        with:
          name: binance-funding-materialization-plan-v0-2-${{ github.run_id }}
          path: artifacts/binance-funding-materialization-plan-v0-2.json
          if-no-files-found: error
          retention-days: 90
