name: Validate V0.8 Shared Relay Secret — Frozen PASS Regression

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "infra/render/binance-transport-free/server.py"
      - "tests/test_render_shared_secret_preflight_v0_8.py"
      - "tests/test_render_shared_secret_handshake_receipt_v0_8.py"
      - "research/receipts/2026-08-19-provider-equivalence-v0-8-shared-relay-secret-handshake-pass.json"
      - ".github/workflows/validate-v0-8-shared-secret-preflight.yml"

permissions:
  contents: read

jobs:
  frozen-pass-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install package and pytest
        run: |
          python -m pip install -e .
          python -m pip install pytest
      - name: Prove auth-only boundary and frozen handshake receipt locally
        run: |
          python -m pytest -q \
            tests/test_render_shared_secret_preflight_v0_8.py \
            tests/test_render_shared_secret_handshake_receipt_v0_8.py \
            tests/test_render_metadata_capture_protocol_v0_7.py \
            tests/test_provider_metadata_cutover_v0_8.py
      - name: Assert frozen PASS is preserved without external handshake rerun
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          receipt = json.loads(Path('research/receipts/2026-08-19-provider-equivalence-v0-8-shared-relay-secret-handshake-pass.json').read_text())
          server = Path('infra/render/binance-transport-free/server.py').read_text()
          assert receipt['status'] == 'PASS'
          assert receipt['result']['shared_secret_match'] is True
          assert receipt['result']['secret_value_recorded'] is False
          assert receipt['result']['provider_requests_performed'] == 0
          assert receipt['result']['r2_writes_performed'] is False
          assert receipt['result']['holdout_candles_accessed'] is False
          assert 'METADATA_RELAY_AUTH_CHECK_PATH = "/metadata/auth-check"' in server
          assert 'METADATA_RELAY_EXECUTION_AUTHORIZED = False' in server
          PY

      - name: Record frozen regression-only state
        run: |
          echo 'V0.8 shared-secret handshake PASS is frozen; this workflow performs no external handshake.'
          echo 'provider_requests_performed=0'
          echo 'r2_writes_performed=false'
          echo 'holdout_candles_accessed=false'
