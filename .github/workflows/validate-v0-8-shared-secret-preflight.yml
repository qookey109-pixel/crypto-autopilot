name: Validate V0.8 Shared Relay Secret Preflight

on:
  pull_request:
    paths:
      - "infra/render/binance-transport-free/server.py"
      - "tests/test_render_shared_secret_preflight_v0_8.py"
      - ".github/workflows/validate-v0-8-shared-secret-preflight.yml"
  push:
    branches: [main]
    paths:
      - "infra/render/binance-transport-free/server.py"
      - "tests/test_render_shared_secret_preflight_v0_8.py"
      - ".github/workflows/validate-v0-8-shared-secret-preflight.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pytest
        run: python -m pip install pytest
      - name: Prove auth-only path cannot call provider or R2
        run: |
          python -m pytest -q \
            tests/test_render_shared_secret_preflight_v0_8.py \
            tests/test_render_metadata_capture_protocol_v0_7.py \
            tests/test_provider_metadata_cutover_v0_8.py

  shared-secret-handshake:
    if: github.event_name != 'pull_request'
    needs: local-boundary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      METADATA_RELAY_TOKEN: ${{ secrets.METADATA_RELAY_TOKEN }}
      AUTH_CHECK_URL: https://qookey-binance-transport-v0-5.onrender.com/metadata/auth-check
    steps:
      - name: Require GitHub Actions secret presence without printing it
        shell: bash
        run: |
          set -euo pipefail
          test -n "${METADATA_RELAY_TOKEN}"

      - name: Wait for matching Render revision and run sanitized secret handshake
        shell: bash
        run: |
          set -euo pipefail
          set +x
          rm -f /tmp/v08-auth-check.json
          success=0
          for attempt in $(seq 1 40); do
            code="$(curl --silent --show-error \
              --output /tmp/v08-auth-check.json \
              --write-out '%{http_code}' \
              -H "Authorization: Bearer ${METADATA_RELAY_TOKEN}" \
              "${AUTH_CHECK_URL}" || true)"
            if [ "${code}" = "200" ]; then
              success=1
              break
            fi
            sleep 3
          done
          test "${success}" = "1"
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('/tmp/v08-auth-check.json').read_text())
          assert p['status'] == 'PASS'
          assert p['stage'] == 'V0_8_SHARED_RELAY_SECRET_MATCH_PRECHECK'
          assert p['shared_secret_match'] is True
          assert p['render_metadata_relay_execution_authorized'] is False
          assert p['render_metadata_relay_enabled'] is False
          assert p['provider_requests_performed'] == 0
          assert p['r2_client_constructed'] is False
          assert p['r2_writes_performed'] is False
          assert p['holdout_candles_accessed'] is False
          assert p['source_switch_performed'] is False
          assert p['live_trading_performed'] is False
          PY

      - name: Publish sanitized readiness summary
        shell: bash
        run: |
          echo 'V0.8 shared relay secret handshake PASS' >> "$GITHUB_STEP_SUMMARY"
          echo '- matching secret proven without printing secret value' >> "$GITHUB_STEP_SUMMARY"
          echo '- provider requests: 0' >> "$GITHUB_STEP_SUMMARY"
          echo '- R2 writes: 0' >> "$GITHUB_STEP_SUMMARY"
          echo '- holdout access: false' >> "$GITHUB_STEP_SUMMARY"
          echo '- Render relay execution remains unauthorized' >> "$GITHUB_STEP_SUMMARY"
