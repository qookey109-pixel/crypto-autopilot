name: Diagnose Funding V0.2 Materialization Run

on:
  pull_request:
    paths:
      - ".github/workflows/diagnose-funding-v0-2-materialization-run.yml"

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Find latest main push materialization run
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/binance-funding-r2-v0-2-materialize.yml/runs?branch=main&event=push&per_page=10" \
            > artifacts/materialization-runs.json
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('artifacts/materialization-runs.json').read_text(encoding='utf-8'))
          runs = data.get('workflow_runs') or []
          if not runs:
              raise SystemExit('NO_MATERIALIZATION_PUSH_RUN_FOUND')
          run = runs[0]
          compact = {
              'id': run['id'],
              'name': run['name'],
              'event': run['event'],
              'status': run['status'],
              'conclusion': run.get('conclusion'),
              'head_branch': run.get('head_branch'),
              'head_sha': run.get('head_sha'),
              'run_number': run.get('run_number'),
              'created_at': run.get('created_at'),
              'updated_at': run.get('updated_at'),
              'html_url': run.get('html_url'),
          }
          Path('artifacts/latest-materialization-run.json').write_text(
              json.dumps(compact, sort_keys=True, indent=2) + '\n', encoding='utf-8'
          )
          print(json.dumps(compact, sort_keys=True))
          PY

      - name: Upload diagnostic result
        uses: actions/upload-artifact@v4
        with:
          name: funding-v0-2-materialization-run-diagnostic-${{ github.run_id }}
          path: artifacts/latest-materialization-run.json
          if-no-files-found: error
          retention-days: 1
