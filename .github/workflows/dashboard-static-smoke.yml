name: Dashboard Static Smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "web/**"
      - "scripts/validate_dashboard_static.py"
      - ".github/workflows/dashboard-static-smoke.yml"

permissions:
  contents: read

concurrency:
  group: dashboard-static-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Validate dashboard safety and required views
        run: python scripts/validate_dashboard_static.py

      - name: Start static server
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server 4173 -d web > /tmp/qookey-dashboard-http.log 2>&1 &
          echo $! > /tmp/qookey-dashboard-http.pid

      - name: Wait for static server readiness
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 20); do
            if curl --fail --silent "http://127.0.0.1:4173/" >/dev/null; then
              exit 0
            fi
            sleep 0.25
          done
          cat /tmp/qookey-dashboard-http.log || true
          exit 1

      - name: HTTP smoke
        shell: bash
        run: |
          set -euo pipefail
          for path in / /assets/css/styles.css /assets/js/app.js /assets/images/cloud-garden-v4.jpg /data/dashboard.json /data/strategy.json; do
            curl --fail --silent --show-error "http://127.0.0.1:4173${path}" >/dev/null
          done

      - name: Stop static server
        if: always()
        shell: bash
        run: |
          if test -f /tmp/qookey-dashboard-http.pid; then
            kill "$(cat /tmp/qookey-dashboard-http.pid)" || true
          fi
