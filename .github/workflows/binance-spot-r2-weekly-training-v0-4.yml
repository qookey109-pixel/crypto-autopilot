name: Binance Spot R2 Weekly Training V0.4 — RETIRED

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-retirement:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Assert V0.4 execution is retired in favor of V0.5 governance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          historical = json.loads(
              Path("config/binance_spot_r2_weekly_training_v0_4.json").read_text()
          )
          current = json.loads(
              Path("config/binance_spot_r2_training_governance_v0_5.json").read_text()
          )
          assert historical["status"] == "R2_ONLY_WEEKLY_MODEL_REVIEW_AUTHORIZED_ON_MAIN_MERGE"
          assert current["status"] == "R2_ONLY_TRAINING_GOVERNANCE_V0_5_AUTHORIZED_ON_MAIN_MERGE"
          assert current["schedule"]["automatic_resume_after_stop"] is False
          assert current["authority"]["holdout_access_authorized"] is False
          assert current["authority"]["live_trading_authorized"] is False
          PY
