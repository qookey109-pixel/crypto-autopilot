name: Quality Visibility V0.1

on:
  pull_request:
    paths:
      - "src/**/*.py"
      - "scripts/**/*.py"
      - "tests/**/*.py"
      - "pyproject.toml"
      - "requirements/**"
      - ".github/workflows/quality-visibility.yml"
  push:
    branches:
      - main
    paths:
      - "src/**/*.py"
      - "scripts/**/*.py"
      - "tests/**/*.py"
      - "pyproject.toml"
      - "requirements/**"
      - ".github/workflows/quality-visibility.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    name: non-blocking quality report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          check-latest: false
      - name: Build deterministic quality visibility report
        run: python scripts/quality_visibility.py --output quality-visibility.json
      - name: Upload informational report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: quality-visibility-${{ github.run_id }}-${{ github.run_attempt }}
          path: quality-visibility.json
          retention-days: 30
          if-no-files-found: error
