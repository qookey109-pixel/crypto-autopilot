name: CTK 15m Archive Diagnosis V0.2

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ctk-15m-archive-diagnosis-v0-2
  cancel-in-progress: false

jobs:
  diagnose:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Characterize bounded CTKUSDT 15m reconciliation
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: "1"
        run: python scripts/diagnose_ctk_archive_v0_2.py

      - name: Assert diagnosis authority boundary
        if: ${{ !cancelled() && hashFiles('ctk-diagnosis-v0-2-output/report.json') != '' }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("ctk-diagnosis-v0-2-output/report.json").read_text())
          assert report.get("r2_accessed", False) is False
          assert report.get("production_repair_performed", False) is False
          assert report.get("holdout_accessed", False) is False
          assert report.get("raw_rows_emitted", False) is False
          assert report.get("source_switch_authorized", False) is False
          assert report.get("pionex_native_relabel_authorized", False) is False
          assert report.get("automatic_model_promotion_authorized", False) is False
          assert report.get("real_money_order_authorized", False) is False
          assert report.get("live_trading_authorized", False) is False
          allowed = {
              "DAILY_NOT_FULL_UTC_DAY",
              "MONTHLY_DAILY_OVERLAP_CONFLICT",
              "MISSING_NOT_FULLY_FILLED",
              "OVERLAP_EVIDENCE_MISSING",
              "RECONCILED_CANDIDATE_AUDIT_FAILED",
              "CONFLICTING_REPLACEMENT_ROW",
              "DAILY_IDENTITY_MISMATCH",
              "DUPLICATE_DAILY_ARCHIVE",
              "DAILY_ROW_ESCAPED_MONTH",
              "MONTHLY_NON_ABSENCE_DEFECT",
              "DAILY_ARCHIVE_VALIDATION_REJECTED",
              "RECONCILIATION_REJECTED_UNKNOWN",
          }
          reason = report.get("reconciliation_rejection_reason")
          assert reason is None or reason in allowed
          PY

      - name: Preserve aggregate diagnosis
        if: ${{ !cancelled() && hashFiles('ctk-diagnosis-v0-2-output/report.json') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ctk-15m-archive-diagnosis-v0-2-${{ github.run_id }}-${{ github.run_attempt }}
          path: ctk-diagnosis-v0-2-output/report.json
          retention-days: 30
          if-no-files-found: error

      - name: Remove disposable runner output
        if: always()
        run: rm -rf ctk-diagnosis-v0-2-output
