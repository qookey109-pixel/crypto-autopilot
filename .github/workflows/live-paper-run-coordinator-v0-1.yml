name: Live Paper Run Coordinator V0.1

on:
  workflow_dispatch:
    inputs:
      input_path:
        description: Repository-relative Live Paper Coordinator input JSON
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: live-paper-persistence-v0-1
  cancel-in-progress: false

jobs:
  run-one-step:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Install constrained package
        run: python -m pip install -c requirements/ci-constraints.txt .

      - name: Require formal main-branch execution
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/main"

      - name: Validate input path
        env:
          INPUT_PATH: ${{ inputs.input_path }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path

          repository_root = Path.cwd().resolve()
          approved_root = (repository_root / "research/inputs/live-paper").resolve()
          raw = os.environ["INPUT_PATH"]
          if not raw or "\n" in raw or "\r" in raw or "\x00" in raw:
              raise SystemExit("input_path contains invalid characters")
          candidate = (repository_root / raw).resolve()
          if approved_root != candidate.parent and approved_root not in candidate.parents:
              raise SystemExit(
                  "input_path must resolve under research/inputs/live-paper"
              )
          if candidate.suffix.lower() != ".json" or not candidate.is_file():
              raise SystemExit("input_path must be an existing JSON file")
          relative = candidate.relative_to(repository_root).as_posix()
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as handle:
              handle.write(f"SAFE_INPUT_PATH={relative}\n")
          PY

      - name: Run exactly one persistent Live Paper step
        id: coordinator
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p artifacts
          set +e
          PYTHONPATH=src python scripts/run_live_paper_coordinator_v0_1.py \
            --input "${SAFE_INPUT_PATH}" \
            --store-backend r2 \
            > artifacts/live-paper-run-coordinator-report.json
          exit_code=$?
          set -e
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"

          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path("artifacts/live-paper-run-coordinator-report.json").read_text(
                  encoding="utf-8"
              )
          )
          assert report["state"] in {
              "LIVE_PAPER_RUN_STEP_COMMITTED",
              "COMMITTED_STEP_REPLAYED",
              "REJECT",
          }
          if report["state"] == "REJECT":
              assert isinstance(report.get("reason"), str) and report["reason"]
              assert report.get("provider_requests_status") in {
                  "KNOWN",
                  "UNKNOWN_OR_PARTIAL",
              }
              assert report.get("persistent_writes_status") in {
                  "KNOWN",
                  "UNKNOWN_OR_PARTIAL",
              }
          authority = report["authority"]
          assert authority["public_live_market_data_authorized"] is True
          assert authority["live_paper_simulation_authorized"] is True
          assert authority["paper_state_persistence_authorized"] is True
          assert authority["automatic_schedule_authorized"] is False
          assert authority["automatic_candidate_generation_authorized"] is False
          assert authority["scorecard_auto_selection_authorized"] is False
          assert authority["private_exchange_api_authorized"] is False
          assert authority["holdout_access_authorized"] is False
          assert authority["real_money_order_authorized"] is False
          assert authority["live_real_trading_authorized"] is False
          PY
          echo "report_safe=true" >> "$GITHUB_OUTPUT"

      - name: Upload coordinator report as secondary evidence
        if: ${{ always() && steps.coordinator.outputs.report_safe == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: live-paper-run-coordinator-v0-1-${{ github.run_id }}
          path: artifacts/live-paper-run-coordinator-report.json
          if-no-files-found: error
          retention-days: 30

      - name: Enforce coordinator outcome
        if: ${{ always() && steps.coordinator.outputs.report_safe == 'true' }}
        shell: bash
        run: |
          code="${{ steps.coordinator.outputs.exit_code }}"
          if [[ "$code" == "0" ]]; then
            exit 0
          fi
          echo "Coordinator failed after producing a validated safe report." >&2
          exit "$code"
