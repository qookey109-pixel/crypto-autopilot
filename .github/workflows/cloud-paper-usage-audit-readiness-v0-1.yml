name: Cloud Paper Usage Audit Readiness V0.1

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloud-paper-usage-audit-readiness-v0-1
  cancel-in-progress: false

jobs:
  readiness:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Report credential-name readiness without network access
        env:
          CF_ACCOUNT_ID_PRESENT: ${{ vars.CLOUDFLARE_ACCOUNT_ID != '' }}
          CF_READONLY_TOKEN_PRESENT: ${{ secrets.CLOUDFLARE_READONLY_API_TOKEN != '' }}
        run: python scripts/cloud_paper_usage_audit_readiness_v0_1.py >> "$GITHUB_STEP_SUMMARY"
