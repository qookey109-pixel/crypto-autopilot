name: Cloud Paper Usage Audit Readiness V0.1

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloud-paper-usage-audit-readiness-v0-1
  cancel-in-progress: false

jobs:
  readiness:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Report credential-name readiness without network access
        env:
          CF_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CF_READONLY_TOKEN: ${{ secrets.CLOUDFLARE_READONLY_API_TOKEN }}
        run: python scripts/cloud_paper_usage_audit_readiness_v0_1.py >> "$GITHUB_STEP_SUMMARY"
