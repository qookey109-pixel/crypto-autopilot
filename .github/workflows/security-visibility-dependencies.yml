name: Security Visibility — Dependencies & SBOM

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  dependency-security:
    # Informational visibility only; findings do not authorize automatic remediation.
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Install pinned project runtime
        run: python -m pip install -c requirements/ci-constraints.txt -e .

      - name: Freeze audited runtime dependency set
        shell: bash
        run: |
          set -euo pipefail
          python -m pip freeze --exclude-editable > runtime-audit-requirements.txt
          test -s runtime-audit-requirements.txt

      - name: Install pinned pip-audit in isolated environment
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/pip-audit"
          "$RUNNER_TEMP/pip-audit/bin/python" -m pip install \
            -c requirements/ci-constraints.txt "pip-audit==2.10.1"
          "$RUNNER_TEMP/pip-audit/bin/pip-audit" --version

      - name: Audit runtime dependencies and build CycloneDX SBOM
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/pip-audit/bin/pip-audit" \
            --no-deps \
            --requirement runtime-audit-requirements.txt \
            --format cyclonedx-json \
            --output dependency-audit.cdx.json

      - name: Summarize dependency security visibility
        if: ${{ always() }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = Path("dependency-audit.cdx.json")
          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
          lines = ["### Dependency security visibility", ""]
          if not report.exists():
              lines.append("- report: MISSING / audit did not produce CycloneDX output")
          else:
              payload = json.loads(report.read_text(encoding="utf-8"))
              components = payload.get("components") or []
              vulnerabilities = payload.get("vulnerabilities") or []
              lines.extend(
                  [
                      f"- components: {len(components)}",
                      f"- known vulnerabilities: {len(vulnerabilities)}",
                      "- mode: informational / non-blocking",
                      "- scope: pinned CI runtime dependency set only",
                  ]
              )
          summary.open("a", encoding="utf-8").write("\n".join(lines) + "\n")
          PY

      - name: Upload dependency audit and SBOM evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: dependency-security-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            runtime-audit-requirements.txt
            dependency-audit.cdx.json
          retention-days: 30
          if-no-files-found: warn
