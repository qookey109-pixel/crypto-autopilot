name: Binance 2025 R2 Pilot — RETIRED

on:
  pull_request:
    paths:
      - ".github/workflows/binance-2025-r2-pilot.yml"
      - "research/receipts/2026-08-18-binance-2025-r2-pilot.json"

permissions:
  contents: read

jobs:
  validate-retired:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate frozen pilot authority without provider or R2 execution
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          receipt = json.loads(Path('research/receipts/2026-08-18-binance-2025-r2-pilot.json').read_text())
          assert receipt['status'] == 'PASS'
          assert receipt['stage'] == 'BINANCE_2025_R2_PILOT_PASS'
          assert receipt['scope']['canonical_object_count'] == 206
          print('RETIRED_NO_EXECUTION')
          print('provider_requests_performed=0')
          print('r2_writes_performed=false')
          print('holdout_candles_accessed=false')
          print('source_switch_authorized=false')
          print('live_trading_authorized=false')
          PY
