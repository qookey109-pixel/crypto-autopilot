name: Binance Funding R2 V0.2 Full Preflight — RETIRED

on:
  pull_request:
    paths:
      - ".github/workflows/binance-funding-r2-v0-2-preflight.yml"
      - "research/receipts/2026-08-19-binance-funding-r2-v0-2-full-preflight.json"

permissions:
  contents: read

jobs:
  validate-retired:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate frozen full-preflight authority without source re-download
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          receipt = json.loads(Path('research/receipts/2026-08-19-binance-funding-r2-v0-2-full-preflight.json').read_text())
          assert receipt['status'] == 'PASS'
          assert receipt['stage'] == 'BINANCE_FUNDING_R2_V0_2_FULL_PREFLIGHT_PASS'
          assert receipt['exact_scope']['source_archive_count'] == 1003
          assert receipt['execution_boundary']['r2_writes_performed'] is False
          print('RETIRED_NO_EXECUTION')
          print('provider_requests_performed=0')
          print('r2_writes_performed=false')
          print('holdout_candles_accessed=false')
          print('source_switch_authorized=false')
          print('live_trading_authorized=false')
          PY
