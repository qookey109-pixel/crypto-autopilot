name: Live Paper Run Recovery V0.1

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Exact Live Paper run id to reconcile
        required: true
        type: string
      repair_missing_result_seals:
        description: Repair only fully verified missing request-result seals
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: live-paper-persistence-v0-1
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Install constrained package
        run: python -m pip install -c requirements/ci-constraints.txt .

      - name: Require formal main-branch execution
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/main"

      - name: Validate recovery run id
        env:
          RUN_ID_INPUT: ${{ inputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          run_id = os.environ["RUN_ID_INPUT"]
          if re.fullmatch(r"live-paper-run-v0-1-[0-9a-f]{64}", run_id) is None:
              raise SystemExit("run_id must match the canonical Live Paper run id format")
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as handle:
              handle.write(f"SAFE_RUN_ID={run_id}\n")
          PY

      - name: Reconcile persistent Live Paper run
        id: recovery
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          REPAIR_MISSING_RESULT_SEALS: ${{ inputs.repair_missing_result_seals }}
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p artifacts
          args=(
            --run-id "${SAFE_RUN_ID}"
            --store-backend r2
          )
          if [[ "${REPAIR_MISSING_RESULT_SEALS}" == "true" ]]; then
            args+=(--repair-missing-result-seals)
          fi

          set +e
          PYTHONPATH=src python scripts/reconcile_live_paper_run_v0_1.py \
            "${args[@]}" \
            > artifacts/live-paper-run-recovery-report.json
          exit_code=$?
          set -e
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"

          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path("artifacts/live-paper-run-recovery-report.json").read_text(
                  encoding="utf-8"
              )
          )
          assert report["state"] in {
              "RUN_CONSISTENT",
              "RUN_EMPTY_RETRY_FROM_INITIAL_STATE_SAFE",
              "MISSING_RESULT_SEALS_REPAIRABLE",
              "MISSING_RESULT_SEALS_REPAIRED",
              "REVIEW_REQUIRED",
              "REJECT",
          }
          authority = report["authority"]
          assert authority["provider_access_authorized"] is False
          assert authority["live_market_data_access_authorized"] is False
          assert authority["account_state_mutation_authorized"] is False
          assert authority["step_state_tick_rewrite_authorized"] is False
          assert authority["automatic_schedule_authorized"] is False
          assert authority["private_exchange_api_authorized"] is False
          assert authority["holdout_access_authorized"] is False
          assert authority["real_money_order_authorized"] is False
          assert authority["live_real_trading_authorized"] is False
          PY

      - name: Upload recovery report as secondary evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: live-paper-run-recovery-v0-1-${{ github.run_id }}
          path: artifacts/live-paper-run-recovery-report.json
          if-no-files-found: error
          retention-days: 30

      - name: Enforce reconciliation outcome
        shell: bash
        run: |
          code="${{ steps.recovery.outputs.exit_code }}"
          if [[ "$code" == "0" ]]; then
            exit 0
          fi
          echo "Recovery/reconciliation requires review or rejected invalid evidence." >&2
          exit "$code"
