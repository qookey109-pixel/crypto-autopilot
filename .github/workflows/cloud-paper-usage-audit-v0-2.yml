name: Cloud Paper One-Time Usage Audit V0.2

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: cloud-paper-usage-audit-v0-2
  cancel-in-progress: false

jobs:
  audit:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Capture one bounded account-wide analytics response
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_READONLY_API_TOKEN: ${{ secrets.CLOUDFLARE_READONLY_API_TOKEN }}
          ACCOUNT_ID_PARITY_VERIFIED: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' && vars.CLOUDFLARE_ACCOUNT_ID != '' && secrets.CLOUDFLARE_ACCOUNT_ID == vars.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m scripts.cloud_paper_usage_audit_v0_2 --output cloud-paper-usage-audit-v0-2/report.json
      - name: Add bounded secret-free report to job summary
        if: always()
        env:
          REPORT_PATH: cloud-paper-usage-audit-v0-2/report.json
        run: |
          if [[ -f "$REPORT_PATH" ]]; then
            cat "$REPORT_PATH" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No report file was produced." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload bounded report artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cloud-paper-usage-audit-v0-2-${{ github.run_id }}-${{ github.run_attempt }}
          path: cloud-paper-usage-audit-v0-2/report.json
          retention-days: 7
          if-no-files-found: warn
      - name: Remove ephemeral report
        if: always()
        run: rm -rf -- cloud-paper-usage-audit-v0-2
