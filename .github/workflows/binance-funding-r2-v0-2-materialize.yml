name: Binance Funding R2 V0.2 Materialization — RETIRED

on:
  pull_request:
    paths:
      - ".github/workflows/binance-funding-r2-v0-2-materialize.yml"
      - "research/receipts/2026-08-19-binance-funding-r2-v0-2-materialization.json"

permissions:
  contents: read

jobs:
  validate-retired:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate frozen Funding materialization authority without writes
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          receipt = json.loads(Path('research/receipts/2026-08-19-binance-funding-r2-v0-2-materialization.json').read_text())
          assert receipt['status'] == 'PASS'
          assert receipt['stage'] == 'BINANCE_FUNDING_R2_V0_2_MATERIALIZATION_PASS'
          assert receipt['postwrite_results']['all_192_authorized_objects_verified_after_write'] is True
          print('RETIRED_NO_EXECUTION')
          print('provider_requests_performed=0')
          print('r2_writes_performed=false')
          print('holdout_candles_accessed=false')
          print('source_switch_authorized=false')
          print('live_trading_authorized=false')
          PY
