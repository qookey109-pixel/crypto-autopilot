name: Binance Funding R2 V0.2 Materialization

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "config/binance_funding_r2_materialization_execution_v0_2.json"

permissions:
  contents: read

concurrency:
  group: binance-funding-r2-v0-2-materialization
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: python -m pip install -e .

      - name: Verify explicit V0.2 execution marker and existing R2 secrets
        shell: bash
        run: |
          set -euo pipefail
          test -f config/binance_funding_r2_materialization_execution_v0_2.json
          test -n "${CLOUDFLARE_ACCOUNT_ID}"
          test -n "${R2_BUCKET_NAME}"
          test -n "${R2_ACCESS_KEY_ID}"
          test -n "${R2_SECRET_ACCESS_KEY}"

      - name: Re-run full 1,003-source preflight then exact-materialize 192 identities
        shell: bash
        run: |
          set -euo pipefail
          python scripts/materialize_binance_funding_r2_v0_2.py \
            --workers 12 \
            --run-id "${GITHUB_RUN_ID}" \
            --output artifacts/binance-funding-r2-v0-2-execution/result.json

      - name: Validate local execution evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('artifacts/binance-funding-r2-v0-2-execution/result.json').read_text(encoding='utf-8'))
          assert data['status'] == 'PASS'
          assert data['stage'] == 'BINANCE_FUNDING_R2_V0_2_MATERIALIZATION_PASS'
          assert data['canonical_scope_sha256'] == '1e0ff54daeec8e5e47376fedb631c663687dd6fb6a4c297d269c33acdf99ad58'
          assert data['source_checksum_set_sha256'] == '881c14d3b3c780b8a0d56ca2f7fd57d2abff310fcd7cb4b13dc01f506b9b64f3'
          assert data['source_archive_count'] == 1003
          assert data['canonical_object_count'] == 94
          assert data['partition_receipt_count'] == 94
          assert data['run_metadata_object_count'] == 4
          assert data['authorized_object_identity_count'] == 192
          assert data['uploaded_object_count'] + data['verified_existing_object_count'] == 192
          assert data['prewrite_exact_conflict_scan_pass'] is True
          assert data['all_192_authorized_objects_verified_after_write'] is True
          assert data['actual_r2_materialization_completed'] is True
          assert data['hypeusdt_2026_deferred'] is True
          assert data['source_switch_authorized'] is False
          assert data['provider_splicing_authorized'] is False
          assert data['interpolation_authorized'] is False
          assert data['pionex_native_relabel_authorized'] is False
          assert data['trade_plan_authorized'] is False
          assert data['real_money_order_authorized'] is False
          assert data['live_trading_authorized'] is False
          PY

      - name: Upload Funding V0.2 materialization evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: binance-funding-r2-v0-2-materialization-${{ github.run_id }}
          path: artifacts/binance-funding-r2-v0-2-execution/result.json
          if-no-files-found: warn
          retention-days: 90
