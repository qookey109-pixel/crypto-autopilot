name: Cloud Paper Billing History V0.1

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: cloud-paper-billing-history-v0-1
  cancel-in-progress: false

jobs:
  audit:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Capture one bounded read-only account billing-history snapshot
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_BILLING_READONLY_API_TOKEN: ${{ secrets.CLOUDFLARE_BILLING_READONLY_API_TOKEN }}
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/cloud_paper_billing_history_v0_1.py --output cloud-paper-billing-history/report.json
      - name: Add secret-free report to job summary
        if: always()
        env:
          REPORT_PATH: cloud-paper-billing-history/report.json
        run: |
          if [[ -f "$REPORT_PATH" ]]; then
            cat "$REPORT_PATH" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No report file was produced." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload short-retention report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cloud-paper-billing-history-v0-1-${{ github.run_id }}-${{ github.run_attempt }}
          path: cloud-paper-billing-history/report.json
          retention-days: 7
          if-no-files-found: warn
      - name: Remove ephemeral report
        if: always()
        run: rm -rf -- cloud-paper-billing-history
