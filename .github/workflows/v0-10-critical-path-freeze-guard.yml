name: V0.10 Critical Path Freeze Guard

on:
  pull_request:
    paths:
      - ".github/workflows/provider-equivalence-v0-10-render-metadata-capture.yml"
      - ".github/workflows/provider-equivalence-v0-2-metadata-capture.yml"
      - "config/provider_equivalence_v0_10_final_atomic_cutover_v0_1.json"
      - "config/provider_equivalence_v0_2_metadata_capture_v0_2.json"
      - "config/provider_equivalence_v0_7_render_metadata_capture_protocol_v0_1.json"
      - "config/provider_equivalence_v0_8_render_metadata_execution_cutover_v0_1.json"
      - "research/receipts/2026-08-20-provider-equivalence-v0-10-final-atomic-cutover-authority.json"
      - "research/receipts/2026-08-20-provider-equivalence-v0-9-render-relay-smoke-pass.json"
      - "research/receipts/2026-08-19-provider-equivalence-v0-8-shared-relay-secret-handshake-pass.json"
      - "research/receipts/2026-08-19-provider-equivalence-v0-2-forward-metadata-capture-authority-v0-2.json"
      - "research/receipts/2026-08-17-m1a-pionex.json"
      - "src/crypto_autopilot/provider_metadata_capture_v0_10.py"
      - "src/crypto_autopilot/provider_metadata_capture_v0_8_successor.py"
      - "src/crypto_autopilot/provider_metadata_capture_v0_2.py"
      - "src/crypto_autopilot/binance_historical.py"
      - "src/crypto_autopilot/storage/r2.py"
      - "scripts/capture_provider_equivalence_v0_10_metadata.py"
      - "infra/render/binance-transport-free/server.py"
      - "infra/render/binance-transport-free/Dockerfile"
      - "requirements/ci-constraints.txt"
      - "pyproject.toml"
      - "config/v0_10_critical_path_freeze_v0_1.json"
      - "config/v0_10_mid_window_emergency_schedule_reactivation_v0_1.json"
      - "config/v0_10_mid_window_emergency_pionex_perp_query_v0_1.json"
      - "config/provider_equivalence_v0_12_successor_metadata_window_v0_1.json"
      - "config/provider_equivalence_v0_12_successor_metadata_window_binding_v0_1.json"
      - "research/receipts/2026-08-31-provider-equivalence-v0-12-successor-metadata-window-authority.json"
      - "research/receipts/2026-08-31-provider-equivalence-v0-12-successor-metadata-window-binding.json"
      - ".github/workflows/provider-equivalence-v0-12-successor-metadata-capture.yml"
      - "src/crypto_autopilot/provider_metadata_capture_v0_12.py"
      - "scripts/capture_provider_equivalence_v0_12_metadata.py"
      - "tests/test_provider_equivalence_v0_12_successor_metadata_window.py"
      - "research/receipts/2026-08-27-v0-10-mid-window-emergency-schedule-reactivation-authority.json"
      - "research/receipts/2026-08-30-v0-10-mid-window-emergency-pionex-perp-query-authority.json"
      - ".github/workflows/v0-10-critical-path-freeze-guard.yml"
      - "tests/test_v0_10_critical_path_freeze_guard.py"
      - "tests/test_v0_10_mid_window_emergency_schedule_reactivation_v0_1.py"
      - "tests/test_v0_10_mid_window_emergency_pionex_perp_query_v0_1.py"
      - "tests/test_v0_10_pionex_perp_query_emergency_v0_1.py"
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify-v0-10-critical-path-freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify frozen V0.10 critical paths match baseline
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          manifest = json.loads(Path('config/v0_10_critical_path_freeze_v0_1.json').read_text())
          assert manifest['status'] == 'FROZEN_PRE_WINDOW'
          baseline = str(manifest['baseline_main_sha'])
          paths = [str(path) for path in manifest['critical_paths']]
          assert len(baseline) == 40
          assert paths and len(paths) == len(set(paths))

          subprocess.run(['git', 'cat-file', '-e', f'{baseline}^{{commit}}'], check=True)

          missing_from_baseline = []
          missing_from_head = []
          for path in paths:
              baseline_check = subprocess.run(
                  ['git', 'cat-file', '-e', f'{baseline}:{path}'],
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
              )
              if baseline_check.returncode != 0:
                  missing_from_baseline.append(path)
              if not Path(path).is_file():
                  missing_from_head.append(path)

          if missing_from_baseline:
              raise SystemExit(f'critical paths missing from frozen baseline: {missing_from_baseline}')
          if missing_from_head:
              raise SystemExit(f'critical paths missing from current checkout: {missing_from_head}')

          result = subprocess.run(
              ['git', 'diff', '--name-only', baseline, 'HEAD', '--', *paths],
              check=True,
              capture_output=True,
              text=True,
          )
          changed = [line.strip() for line in result.stdout.splitlines() if line.strip()]
          if changed:
              successor_path = Path(
                  'config/provider_equivalence_v0_12_successor_metadata_window_v0_1.json'
              )
              successor_receipt_path = Path(
                  'research/receipts/'
                  '2026-08-31-provider-equivalence-v0-12-successor-metadata-window-authority.json'
              )
              binding_path = Path(
                  'config/provider_equivalence_v0_12_successor_metadata_window_binding_v0_1.json'
              )
              binding_receipt_path = Path(
                  'research/receipts/'
                  '2026-08-31-provider-equivalence-v0-12-successor-metadata-window-binding.json'
              )
              if all(path.is_file() for path in (
                  successor_path,
                  successor_receipt_path,
                  binding_path,
                  binding_receipt_path,
              )):
                  successor = json.loads(successor_path.read_text())
                  successor_receipt = json.loads(successor_receipt_path.read_text())
                  binding = json.loads(binding_path.read_text())
                  binding_receipt = json.loads(binding_receipt_path.read_text())
                  if successor['status'] != (
                      'AUTHORIZED_FOR_PROTECTED_MAIN_REVIEW_NOT_EFFECTIVE_BEFORE_MERGE'
                  ):
                      raise SystemExit('V0.12 successor authority status is invalid')
                  if successor_receipt['status'] != 'PASS':
                      raise SystemExit('V0.12 successor receipt is not PASS')
                  if successor['lineage']['protected_main_pr_number'] != 0 or successor[
                      'lineage'
                  ]['minimum_operational_change_commit_sha'] is not None:
                      raise SystemExit('V0.12 frozen pre-binding authority was rewritten')
                  if successor_receipt['effectivity']['protected_main_pr_number'] != 0 or (
                      successor_receipt['effectivity'][
                          'minimum_operational_change_commit_sha'
                      ] is not None
                  ):
                      raise SystemExit('V0.12 frozen pre-binding receipt was rewritten')
                  if binding['bound_authority'] != str(successor_path):
                      raise SystemExit('V0.12 append-only authority binding changed')
                  if binding_receipt['protocol'] != str(binding_path):
                      raise SystemExit('V0.12 binding receipt protocol changed')
                  if binding_receipt['protocol_sha256'] != hashlib.sha256(
                      binding_path.read_bytes()
                  ).hexdigest():
                      raise SystemExit('V0.12 binding receipt SHA-256 changed')

                  expected_frozen_drift = {
                      '.github/workflows/provider-equivalence-v0-10-render-metadata-capture.yml',
                      '.github/workflows/provider-equivalence-v0-2-metadata-capture.yml',
                      'src/crypto_autopilot/provider_metadata_capture_v0_10.py',
                  }
                  if set(changed) != expected_frozen_drift:
                      raise SystemExit(
                          'V0.12 successor changes an unauthorized frozen critical path'
                      )

                  lineage = binding['lineage']
                  if lineage['pre_change_main_sha'] != (
                      'a6c2f0748a2b352f1ccac1fc349bbd4e0b3b80d4'
                  ):
                      raise SystemExit('V0.12 pre-change main SHA changed')
                  pr_number = lineage['protected_main_pr_number']
                  change_sha = str(lineage['minimum_operational_change_commit_sha'])
                  if not isinstance(pr_number, int) or pr_number <= 0:
                      raise SystemExit('V0.12 protected-main PR binding is missing')
                  if len(change_sha) != 40:
                      raise SystemExit('V0.12 operational commit binding is missing')
                  if binding_receipt['lineage']['protected_main_pr_number'] != pr_number:
                      raise SystemExit('V0.12 binding receipt PR differs from config')
                  if binding_receipt['lineage'][
                      'minimum_operational_change_commit_sha'
                  ] != change_sha:
                      raise SystemExit('V0.12 binding receipt commit differs from config')
                  subprocess.run(
                      ['git', 'merge-base', '--is-ancestor', change_sha, 'HEAD'], check=True
                  )

                  operational_result = subprocess.run(
                      [
                          'git', 'diff', '--name-only',
                          lineage['pre_change_main_sha'], change_sha,
                          '--', *paths,
                      ],
                      check=True,
                      capture_output=True,
                      text=True,
                  )
                  operational_changed = {
                      line.strip()
                      for line in operational_result.stdout.splitlines()
                      if line.strip()
                  }
                  if operational_changed != {
                      '.github/workflows/provider-equivalence-v0-10-render-metadata-capture.yml',
                      '.github/workflows/provider-equivalence-v0-2-metadata-capture.yml',
                  }:
                      raise SystemExit(
                          'V0.12 operational commit changes another frozen critical path'
                      )

                  event_name = os.environ.get('GITHUB_EVENT_NAME', '')
                  if event_name == 'pull_request':
                      event = json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text())
                      if event['number'] != pr_number:
                          raise SystemExit('V0.12 authority is used by the wrong PR')
                      if event['pull_request']['base']['sha'] != lineage['pre_change_main_sha']:
                          raise SystemExit('V0.12 PR base SHA changed')

                  v010_lines = Path(
                      '.github/workflows/provider-equivalence-v0-10-render-metadata-capture.yml'
                  ).read_text().splitlines()
                  v02_lines = Path(
                      '.github/workflows/provider-equivalence-v0-2-metadata-capture.yml'
                  ).read_text().splitlines()
                  v012_lines = Path(
                      '.github/workflows/provider-equivalence-v0-12-successor-metadata-capture.yml'
                  ).read_text().splitlines()
                  if any(line == '  schedule:' for line in v010_lines):
                      raise SystemExit('V0.10 schedule was not retired')
                  if any(line == '  schedule:' for line in v02_lines):
                      raise SystemExit('V0.2 schedule was reactivated')
                  active_crons = [
                      line.split('"', 2)[1]
                      for line in v012_lines
                      if line.strip().startswith('- cron: "')
                  ]
                  expected_crons = [
                      '17,47 2-23 4 9 *',
                      '17,47 * 5,6,7,8,9,10,11 9 *',
                      '17,47 0-3 12 9 *',
                  ]
                  transition = successor['atomic_schedule_transition']
                  if active_crons != expected_crons:
                      raise SystemExit('V0.12 active cron text changed')
                  if transition['successor_cron_utc'] != expected_crons:
                      raise SystemExit('V0.12 cron authority changed')
                  if transition['scheduled_attempt_count'] != 388:
                      raise SystemExit('V0.12 scheduled attempt count changed')
                  if transition['hourly_slot_count'] != 194:
                      raise SystemExit('V0.12 hourly-slot count changed')
                  if transition[
                      'concurrent_v0_10_and_v0_12_capture_paths_authorized'
                  ] is not False:
                      raise SystemExit('V0.12 concurrent capture paths became authorized')

                  boundary = successor['authorization_boundary']
                  for key, value in boundary.items():
                      if key.startswith('v0_12_metadata'):
                          if value is not True:
                              raise SystemExit(f'V0.12 metadata authority missing: {key}')
                      elif value is not False:
                          raise SystemExit(f'V0.12 downstream boundary changed: {key}')

                  print(json.dumps({
                      'status': 'PASS',
                      'stage': 'V0_10_RETIRED_V0_12_SUCCESSOR_AUTHORITY_REVIEW_PASS',
                      'baseline_main_sha': baseline,
                      'changed_critical_paths': changed,
                      'protected_main_pr_number': pr_number,
                      'minimum_operational_change_commit_sha': change_sha,
                      'scheduled_attempt_count': 388,
                      'hourly_slot_count': 194,
                      'prior_v0_10_failures_regraded': False,
                      'manual_v0_10_capture_authorized': False,
                      'provider_requests_performed': 0,
                      'render_requests_performed': 0,
                      'r2_client_constructed': False,
                      'r2_reads_performed': False,
                      'r2_writes_performed': False,
                      'holdout_accessed': False,
                      'v0_12_production_stability_evaluation_performed': False,
                      'source_switch_authorized': False,
                      'live_trading_authorized': False,
                  }, sort_keys=True))
                  raise SystemExit(0)

              schedule_emergency_path = Path(
                  'config/v0_10_mid_window_emergency_schedule_reactivation_v0_1.json'
              )
              pionex_emergency_path = Path(
                  'config/v0_10_mid_window_emergency_pionex_perp_query_v0_1.json'
              )
              schedule_expected_changed = [
                  '.github/workflows/provider-equivalence-v0-10-render-metadata-capture.yml'
              ]
              pionex_expected_changed = [
                  '.github/workflows/provider-equivalence-v0-10-render-metadata-capture.yml',
                  'src/crypto_autopilot/provider_metadata_capture_v0_10.py',
              ]
              recognized_change = changed in (
                  schedule_expected_changed,
                  pionex_expected_changed,
              )
              required_authorities_present = (
                  schedule_emergency_path.is_file()
                  and (
                      changed != pionex_expected_changed
                      or pionex_emergency_path.is_file()
                  )
              )
              if not recognized_change or not required_authorities_present:
                  print(json.dumps({
                      'status': 'FAIL',
                      'stage': 'V0_10_CRITICAL_PATH_DRIFT_DETECTED',
                      'baseline_main_sha': baseline,
                      'changed_critical_paths': changed,
                      'automatic_repair_authorized': False,
                      'manual_v0_10_capture_authorized': False,
                      'provider_requests_performed': 0,
                      'render_requests_performed': 0,
                      'r2_client_constructed': False,
                      'r2_reads_performed': False,
                      'r2_writes_performed': False,
                      'holdout_accessed': False,
                      'v0_11_production_evaluation_performed': False,
                      'source_switch_authorized': False,
                      'live_trading_authorized': False,
                  }, sort_keys=True))
                  raise SystemExit(
                      'V0.10 critical path drift detected; reviewed versioned authority required'
                  )

              emergency = json.loads(schedule_emergency_path.read_text())
              if emergency['status'] != (
                  'AUTHORIZED_FOR_PROTECTED_MAIN_REVIEW_NOT_EFFECTIVE_BEFORE_MERGE'
              ):
                  raise SystemExit('V0.10 emergency authority status is invalid')
              lineage = emergency['lineage']
              if lineage['protected_main_pr_number'] != 201:
                  raise SystemExit('V0.10 emergency authority PR binding changed')
              if lineage['pre_change_main_sha'] != (
                  '49c6bedb1e79e20963519b7f344762129669feb9'
              ):
                  raise SystemExit('V0.10 emergency pre-change main SHA changed')
              change_sha = str(lineage['minimum_operational_change_commit_sha'])
              subprocess.run(
                  ['git', 'merge-base', '--is-ancestor', change_sha, 'HEAD'], check=True
              )

              event_name = os.environ.get('GITHUB_EVENT_NAME', '')
              if event_name == 'pull_request' and changed == schedule_expected_changed:
                  event = json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text())
                  if event['number'] != lineage['protected_main_pr_number']:
                      raise SystemExit('V0.10 emergency authority is used by the wrong PR')
                  if event['pull_request']['base']['sha'] != lineage['pre_change_main_sha']:
                      raise SystemExit('V0.10 emergency PR base SHA changed')

              if changed[0] not in emergency['exact_files_allowed_to_change']:
                  raise SystemExit('changed V0.10 path is outside the emergency allowlist')
              if any(value is not False for value in emergency['authorization_boundary'].values()):
                  raise SystemExit('V0.10 emergency downstream boundary changed')
              if emergency['render_boundary']['transport_affected'] is not False:
                  raise SystemExit('V0.10 emergency unexpectedly affects Render transport')

              schedule = emergency['schedule_equivalence']
              frozen = json.loads(
                  Path('config/provider_equivalence_v0_10_final_atomic_cutover_v0_1.json').read_text()
              )
              original = schedule['original_authorized_crons']
              replacement = schedule['replacement_registration_crons']
              if original != frozen['atomic_repository_cutover']['successor_cron_utc']:
                  raise SystemExit('V0.10 frozen cron lineage changed')
              new_lines = Path(schedule_expected_changed[0]).read_text().splitlines()
              active = [
                  line.split('"', 2)[1]
                  for line in new_lines
                  if line.strip().startswith('- cron: "')
              ]
              if active != replacement:
                  raise SystemExit('V0.10 active cron text differs from emergency authority')

              def field_values(field, lower, upper):
                  if field == '*':
                      return set(range(lower, upper + 1))
                  values = set()
                  for item in field.split(','):
                      if '-' in item:
                          start, end = item.split('-', 1)
                          values.update(range(int(start), int(end) + 1))
                      else:
                          values.add(int(item))
                  if not values or min(values) < lower or max(values) > upper:
                      raise SystemExit('invalid V0.10 emergency cron field')
                  return values

              def matches(cron, instant):
                  minute, hour, day, month, weekday = cron.split()
                  if weekday != '*':
                      raise SystemExit('V0.10 emergency weekday scope changed')
                  return (
                      instant.minute in field_values(minute, 0, 59)
                      and instant.hour in field_values(hour, 0, 23)
                      and instant.day in field_values(day, 1, 31)
                      and instant.month in field_values(month, 1, 12)
                  )

              def expand(crons):
                  cursor = datetime(2026, 8, 27, 0, 0, tzinfo=timezone.utc)
                  final_attempt = datetime(2026, 9, 4, 1, 47, tzinfo=timezone.utc)
                  attempts = []
                  while cursor <= final_attempt:
                      if any(matches(cron, cursor) for cron in crons):
                          attempts.append(cursor)
                      cursor += timedelta(minutes=1)
                  return attempts

              original_attempts = expand(original)
              replacement_attempts = expand(replacement)
              if replacement_attempts != original_attempts or len(replacement_attempts) != 388:
                  raise SystemExit('V0.10 emergency cron set is not semantically equivalent')
              if len({instant.replace(minute=0) for instant in replacement_attempts}) != 194:
                  raise SystemExit('V0.10 emergency hourly-slot count changed')

              if changed == pionex_expected_changed:
                  pionex_emergency = json.loads(pionex_emergency_path.read_text())
                  if pionex_emergency['status'] != (
                      'AUTHORIZED_FOR_PROTECTED_MAIN_REVIEW_NOT_EFFECTIVE_BEFORE_MERGE'
                  ):
                      raise SystemExit('V0.10 Pionex emergency authority status is invalid')

                  pionex_lineage = pionex_emergency['lineage']
                  if pionex_lineage['protected_main_pr_number'] != 210:
                      raise SystemExit('V0.10 Pionex emergency PR binding changed')
                  if pionex_lineage['pre_change_main_sha'] != (
                      '62c3fee76016f8f42d3e444df79f87e2d55a5fc8'
                  ):
                      raise SystemExit('V0.10 Pionex emergency pre-change main SHA changed')
                  pionex_change_sha = str(
                      pionex_lineage['minimum_operational_change_commit_sha']
                  )
                  if pionex_change_sha != (
                      'a56fcff85e65a051b3848a0362edfa7a6e9019f6'
                  ):
                      raise SystemExit('V0.10 Pionex operational commit binding changed')
                  subprocess.run(
                      ['git', 'merge-base', '--is-ancestor', pionex_change_sha, 'HEAD'],
                      check=True,
                  )

                  operational_result = subprocess.run(
                      [
                          'git',
                          'diff',
                          '--name-only',
                          pionex_lineage['pre_change_main_sha'],
                          pionex_change_sha,
                          '--',
                          *paths,
                      ],
                      check=True,
                      capture_output=True,
                      text=True,
                  )
                  operational_changed = [
                      line.strip()
                      for line in operational_result.stdout.splitlines()
                      if line.strip()
                  ]
                  if operational_changed != [
                      'src/crypto_autopilot/provider_metadata_capture_v0_10.py'
                  ]:
                      raise SystemExit(
                          'V0.10 Pionex operational commit changes another critical path'
                      )

                  if event_name == 'pull_request':
                      event = json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text())
                      if event['number'] != pionex_lineage['protected_main_pr_number']:
                          raise SystemExit('V0.10 Pionex authority is used by the wrong PR')
                      if event['pull_request']['base']['sha'] != (
                          pionex_lineage['pre_change_main_sha']
                      ):
                          raise SystemExit('V0.10 Pionex emergency PR base SHA changed')

                  if pionex_emergency['exact_critical_paths_changed_from_frozen_baseline'] != (
                      pionex_expected_changed
                  ):
                      raise SystemExit('V0.10 Pionex critical-path allowlist changed')
                  if any(
                      value is not False
                      for value in pionex_emergency['authorization_boundary'].values()
                  ):
                      raise SystemExit('V0.10 Pionex emergency downstream boundary changed')
                  if any(
                      value is not False
                      for value in pionex_emergency['render_boundary'].values()
                  ):
                      raise SystemExit('V0.10 Pionex emergency affects Render')

                  request = pionex_emergency['request_contract']
                  expected_request = {
                      'provider': 'pionex',
                      'method': 'GET',
                      'endpoint': 'https://api.pionex.com/api/v1/common/symbols',
                      'query_parameter': 'type',
                      'query_value': 'PERP',
                      'additional_query_parameters_added': [],
                      'public_endpoint_no_api_key_required': True,
                      'conflicting_existing_type_must_fail_closed': True,
                      'binance_request_changed': False,
                      'render_relay_changed': False,
                  }
                  if request != expected_request:
                      raise SystemExit('V0.10 Pionex emergency request contract changed')

                  provider_text = Path(
                      'src/crypto_autopilot/provider_metadata_capture_v0_10.py'
                  ).read_text()
                  required_provider_fragments = (
                      'V0_10_PIONEX_MARKET_TYPE = "PERP"',
                      '_pionex_perp_endpoint(str(pionex_cfg["public_endpoint"]))',
                      'Pionex metadata endpoint has conflicting market type',
                  )
                  if not all(
                      fragment in provider_text for fragment in required_provider_fragments
                  ):
                      raise SystemExit('V0.10 Pionex PERP implementation contract changed')

                  preserved = pionex_emergency['preserved_frozen_scope']
                  if preserved['replacement_holdout_state'] != 'FROZEN_UNOPENED':
                      raise SystemExit('V0.10 Pionex emergency opened the holdout')
                  if any(
                      value is not True
                      for key, value in preserved.items()
                      if key != 'replacement_holdout_state'
                  ):
                      raise SystemExit('V0.10 Pionex emergency changed frozen scope')

                  print(json.dumps({
                      'status': 'PASS',
                      'stage': 'V0_10_AUTHORIZED_EMERGENCY_PIONEX_PERP_QUERY_REVIEW_PASS',
                      'baseline_main_sha': baseline,
                      'changed_critical_paths': changed,
                      'protected_main_pr_number': pionex_lineage['protected_main_pr_number'],
                      'minimum_operational_change_commit_sha': pionex_change_sha,
                      'pionex_query': 'type=PERP',
                      'prior_failed_or_missing_attempts_remain_failures': True,
                      'automatic_repair_authorized': False,
                      'manual_v0_10_capture_authorized': False,
                      'provider_requests_performed': 0,
                      'render_requests_performed': 0,
                      'r2_client_constructed': False,
                      'r2_reads_performed': False,
                      'r2_writes_performed': False,
                      'holdout_accessed': False,
                      'v0_11_production_evaluation_performed': False,
                      'source_switch_authorized': False,
                      'live_trading_authorized': False,
                  }, sort_keys=True))
                  raise SystemExit(0)

              print(json.dumps({
                  'status': 'PASS',
                  'stage': 'V0_10_AUTHORIZED_EMERGENCY_SCHEDULE_REREGISTRATION_REVIEW_PASS',
                  'baseline_main_sha': baseline,
                  'changed_critical_paths': changed,
