name: Cloud Paper Billing Metadata Diagnostic V0.5

on:
  workflow_dispatch:
    inputs:
      confirm_one_time_read_only:
        description: 'Distinct approval: consume this one-time diagnostic and issue at most one read-only GET'
        required: true
        type: boolean
        default: false

permissions:
  actions: read
  contents: read

concurrency:
  group: cloud-paper-billing-metadata-diagnostic-v0-5
  cancel-in-progress: false

jobs:
  diagnostic:
    if: github.ref == 'refs/heads/main' && inputs.confirm_one_time_read_only == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Make one confirmed value-free metadata diagnostic
        env:
          INPUT_CONFIRM_ONE_TIME_READ_ONLY: ${{ inputs.confirm_one_time_read_only }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_BILLING_READONLY_API_TOKEN: ${{ secrets.CLOUDFLARE_BILLING_READONLY_API_TOKEN }}
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m scripts.cloud_paper_billing_metadata_diagnostic_v0_5 --output cloud-paper-billing-metadata-v0-5/report.json
      - name: Add safe report to job summary
        if: always()
        env:
          REPORT_PATH: cloud-paper-billing-metadata-v0-5/report.json
        run: |
          if [[ -f "$REPORT_PATH" ]]; then
            cat "$REPORT_PATH" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No report file was produced." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload seven-day value-free report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cloud-paper-billing-metadata-v0-5-${{ github.run_id }}-${{ github.run_attempt }}
          path: cloud-paper-billing-metadata-v0-5/report.json
          retention-days: 7
          if-no-files-found: warn
      - name: Remove ephemeral output
        if: always()
        run: rm -rf -- cloud-paper-billing-metadata-v0-5
