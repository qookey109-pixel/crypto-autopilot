name: Binance USD-M Crypto Core 100 Training V0.2

run-name: ${{ inputs.bootstrap_v0_2 && format('CORE100_V02_BOOTSTRAP {0}', github.run_number) || format('Core100 fingerprint check {0}', github.run_number) }}

on:
  schedule:
    - cron: "37 4 * * 0"
  workflow_dispatch:
    inputs:
      bootstrap_v0_2:
        description: "Consume the one-time authorized V0.2 baseline"
        required: true
        type: boolean
        default: false
  push:
    branches:
      - main
    paths:
      - "research/receipts/2026-09-15-core100-early-training-one-shot-authority.json"

permissions:
  contents: read
  actions: read

concurrency:
  group: binance-usdm-detailed-training-v0-1
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Validate one-shot early-training authority on push
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          receipt="research/receipts/2026-09-15-core100-early-training-one-shot-authority.json"
          if git cat-file -e "HEAD^1:${receipt}" 2>/dev/null; then
            echo "one-shot authority receipt existed before this protected-main push; refusing re-execution"
            exit 1
          fi
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          receipt = json.loads(
              Path("research/receipts/2026-09-15-core100-early-training-one-shot-authority.json").read_text()
          )
          assert receipt["schema"] == "qookey-core100-early-training-one-shot-authority-v0.1"
          assert receipt["status"] == "AUTHORIZED_FOR_PROTECTED_MAIN_ONE_SHOT_AFTER_MERGE"
          assert receipt["user_authorization"]["early_execution_authorized"] is True
          assert receipt["user_authorization"]["merge_authority_granted_by_this_receipt"] is False
          assert receipt["data_precondition"]["production_completion_verified"] is True
          assert receipt["data_precondition"]["primary_complete_shards"] == 10
          assert receipt["data_precondition"]["primary_total_shards"] == 10
          assert receipt["execution"]["one_shot"] is True
          assert receipt["execution"]["existing_weekly_training_schedule_unchanged"] is True
          boundary = receipt["safety_boundary"]
          assert all(value is False for value in boundary.values())
          source_main = receipt["authorized_source_main_sha"]
          subprocess.run(["git", "merge-base", "--is-ancestor", source_main, "HEAD"], check=True)
          PY

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Create isolated project runtime
        if: github.event_name != 'push'
        shell: bash
        run: |
          set -euo pipefail
          venv="$RUNNER_TEMP/core100-fingerprint-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          python -m venv "$venv"
          "$venv/bin/python" -m pip install -c requirements/ci-constraints.txt .
          echo "CORE100_FINGERPRINT_PYTHON=$venv/bin/python" >> "$GITHUB_ENV"
          echo "CORE100_FINGERPRINT_ISOLATED_ENVIRONMENT=true" >> "$GITHUB_ENV"

      - name: Run V0.2 comparator or the single authorized bootstrap
        if: github.event_name != 'push'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          INPUT_BOOTSTRAP_V0_2: ${{ inputs.bootstrap_v0_2 }}
        run: |
          "$CORE100_FINGERPRINT_PYTHON" scripts/train_binance_detailed_history_models_v0_4.py \
            --config config/binance_usdm_detailed_history_v0_1_2.json \
            --authority research/receipts/2026-08-29-binance-usdm-crypto-core-100-v0-1-2-authority.json \
            --fingerprint-contract config/core100_training_fingerprint_v0_2_successor_v0_1.json \
            --bootstrap-authority config/core100_training_fingerprint_v0_2_bootstrap_authority_v0_1.json \
            --implementation-receipt research/receipts/2026-09-25-core100-training-fingerprint-v0-2-implementation.json \
            --run-id "github-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --output detailed-training-output/report.json

      - name: Require explicit report status
        if: github.event_name != 'push' && always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("detailed-training-output/report.json").read_text())
          assert report.get("status") in {"PASS", "NO_CHANGE", "REVIEW_REQUIRED", "SKIPPED"}
          if report["status"] == "REVIEW_REQUIRED":
              raise SystemExit("Core100 V0.2 requires review; see the cloud report artifact")
          if report["status"] == "SKIPPED":
              assert report["r2_access_performed"] is False
              assert report["training_performed"] is False
              assert report["r2_writes_performed"] is False
          if report["status"] == "NO_CHANGE":
              assert report["training_performed"] is False
              assert report["r2_writes_performed"] is False
              assert report["provider_requests_performed"] == 0
          PY

      - name: Upload secret-free training evidence
        if: github.event_name != 'push' && always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: binance-usdm-core100-fingerprint-v0-2-${{ github.run_id }}-${{ github.run_attempt }}
          path: detailed-training-output/report.json
          retention-days: 90
          if-no-files-found: warn

      - name: Remove disposable runner output
        if: always()
        run: rm -rf detailed-training-output
