name: Binance USD-M Crypto Core 100 Training V0.1.2

on:
  schedule:
    - cron: "37 4 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: binance-usdm-detailed-training-v0-1
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Install constrained runtime
        run: python -m pip install -c requirements/ci-constraints.txt .

      - name: Train only from a complete governed R2 dataset
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          python scripts/train_binance_detailed_history_models.py \
            --config config/binance_usdm_detailed_history_v0_1_2.json \
            --authority research/receipts/2026-08-29-binance-usdm-crypto-core-100-v0-1-2-authority.json \
            --run-id "github-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --output detailed-training-output/report.json

      - name: Assert no promotion or trading authority
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("detailed-training-output/report.json").read_text())
          if report.get("status") == "PASS":
              authority = report["authority"]
              assert authority["pionex_native_relabel_authorized"] is False
              assert authority["source_switch_authorized"] is False
              assert authority["automatic_model_promotion_authorized"] is False
              assert authority["formal_trade_plan_authorized"] is False
              assert authority["real_money_order_authorized"] is False
              assert authority["live_trading_authorized"] is False
          PY

      - name: Upload secret-free training evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: binance-usdm-detailed-training-${{ github.run_id }}-${{ github.run_attempt }}
          path: detailed-training-output/report.json
          retention-days: 90
          if-no-files-found: error

      - name: Remove disposable runner output
        if: always()
        run: rm -rf detailed-training-output
