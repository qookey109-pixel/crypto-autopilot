name: BTC Fixed Sample Simulation V0.1 — RETIRED

on:
  pull_request:
    paths:
      - ".github/workflows/simulation-btc-v0-1.yml"
      - "research/receipts/2026-09-11-simulation-btc-fixed-sample-v0-1-pass.json"
      - "scripts/build_cloud_run_status.py"
      - "tests/test_cloud_run_status.py"
      - "config/project_convergence_v0_1.json"

permissions:
  contents: read

jobs:
  validate-retired:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Assert fixed BTC V0.1 is frozen and cannot execute again
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          receipt = json.loads(Path(
              'research/receipts/2026-09-11-simulation-btc-fixed-sample-v0-1-pass.json'
          ).read_text(encoding='utf-8'))
          expected = {
              'schema': 'simulation-btc-fixed-sample-receipt-v0.1',
              'status': 'PASS',
              'claim': 'BTC_FIXED_SAMPLE_READY',
              'scope': 'BTC_FIXED_27_DAY_ENGINE_VALIDATION_ONLY',
              'main_sha': '25cdf4a9cf66749885fb7b5c33046330870d19d8',
              'workflow_run_id': '34615465566',
              'workflow_run_attempt': 1,
              'artifact_id': '10269674365',
              'report_sha256': '8cde42d1d52fffcaf39251a29541ac1c13a91658a5349ef664e7601d061ee2a5',
              'report_status': 'READY',
              'full_simulation_ready': False,
              'full_universe_ready': False,
              'execution_authority_granted_by_this_receipt': False,
              'source_switch_authorized': False,
              'holdout_accessed': False,
              'live_trading_authorized': False,
              'real_money_orders_authorized': False,
              'r2_writes': False,
          }
          for key, value in expected.items():
              assert receipt.get(key) == value, key
          print('RETIRED_FIXED_SAMPLE_COMPLETE')
          print('automatic_execution_authorized=false')
          print('provider_requests_performed=0')
          print('r2_reads_performed=0')
          print('r2_writes_performed=false')
          print('holdout_accessed=false')
          print('live_trading_authorized=false')
          PY
