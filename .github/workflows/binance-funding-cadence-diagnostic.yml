name: Binance Funding Cadence Diagnostic

on:
  pull_request:
    paths:
      - ".github/workflows/binance-funding-cadence-diagnostic.yml"
      - "scripts/diagnose_binance_funding_cadence.py"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e .
      - name: Diagnose Funding cadence residuals
        run: python scripts/diagnose_binance_funding_cadence.py
