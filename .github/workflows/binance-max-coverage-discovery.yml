name: Binance Maximum Coverage Discovery — RETIRED

on:
  pull_request:
    paths:
      - ".github/workflows/binance-max-coverage-discovery.yml"
      - "research/receipts/2026-08-18-binance-max-coverage-discovery.json"

permissions:
  contents: read

jobs:
  validate-retired:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Validate frozen maximum-coverage authority without provider access
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          receipt = json.loads(Path('research/receipts/2026-08-18-binance-max-coverage-discovery.json').read_text(encoding='utf-8'))
          assert receipt['status'] == 'PASS'
          assert receipt['stage'] == 'BINANCE_MAX_COVERAGE_DISCOVERY_PASS'
          assert receipt['candidate_count'] == 15
          assert receipt['coverage_counts']['monthly_archive_checks'] == 5760
          boundary = receipt['authority_boundary']
          assert boundary['authorizes_source_switch'] is False
          assert boundary['authorizes_large_scale_backfill'] is False
          assert boundary['authorizes_live_trading'] is False
          print('RETIRED_NO_EXECUTION')
          print('provider_requests_performed=0')
          print('r2_client_constructed=false')
          print('r2_reads_performed=false')
          print('r2_writes_performed=false')
          print('holdout_candles_accessed=false')
          print('source_switch_authorized=false')
          print('live_trading_authorized=false')
          PY
