name: Funding Coverage Edge Diagnostic

on:
  pull_request:
    paths:
      - ".github/workflows/hype-funding-edge-diagnostic.yml"
      - "scripts/diagnose_funding_coverage_edges.py"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e .
      - name: Diagnose all Funding coverage edge cadence residuals
        run: python scripts/diagnose_funding_coverage_edges.py
