name: HYPE Funding Edge Diagnostic

on:
  pull_request:
    paths:
      - ".github/workflows/hype-funding-edge-diagnostic.yml"
      - "scripts/diagnose_hype_funding_2026_07.py"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e .
      - name: Diagnose HYPE Funding 2026-07 cadence
        run: python scripts/diagnose_hype_funding_2026_07.py
