name: Binance Spot R2 Training Governance V0.5

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: binance-spot-r2-research-v0-5
  cancel-in-progress: false

jobs:
  sync-train-review-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Check frozen holdout boundary before provider or R2 access
        id: window
        env:
          PYTHONPATH: src
        run: |
          python scripts/check_binance_spot_training_window.py \
            --config config/binance_spot_r2_training_governance_v0_5.json \
            --github-output "$GITHUB_OUTPUT"

      - name: Install constrained runtime
        if: steps.window.outputs.run_allowed == 'true'
        run: python -m pip install -c requirements/ci-constraints.txt .

      - name: Discover public Binance Spot training catalog
        if: steps.window.outputs.run_allowed == 'true'
        run: |
          python scripts/discover_binance_training_universe.py \
            --output online-training/market-catalog.json \
            --quotes USDT USDC

      - name: Build complete provider-separated daily dataset
        if: steps.window.outputs.run_allowed == 'true'
        run: |
          python scripts/fetch_binance_internal_training.py \
            --catalog online-training/market-catalog.json \
            --output-dir online-training/dataset \
            --requests-per-second 5

      - name: Train model and build governed weekly evidence
        if: steps.window.outputs.run_allowed == 'true'
        run: |
          python scripts/train_binance_spot_daily_models.py \
            --config config/binance_spot_r2_training_governance_v0_5.json \
            --dataset online-training/dataset/binance-spot-internal-training-1d.parquet \
            --model-output online-training/training/model.json \
            --metrics-output online-training/training/metrics.json \
            --review-output online-training/training/weekly-review.json

      - name: Validate locally then publish immutable V0.5 evidence to R2
        if: steps.window.outputs.run_allowed == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          V0_5_WEEKLY_ACTIVATION_MODE: ${{ github.event_name == 'workflow_dispatch' && 'MANUAL_TRAINING' || 'SCHEDULED_TRAINING' }}
        run: |
          python scripts/publish_binance_spot_training_to_r2.py \
            --config config/binance_spot_r2_training_governance_v0_5.json \
            --catalog online-training/market-catalog.json \
            --dataset online-training/dataset/binance-spot-internal-training-1d.parquet \
            --dataset-receipt online-training/dataset/receipt.json \
            --model online-training/training/model.json \
            --metrics online-training/training/metrics.json \
            --weekly-review online-training/training/weekly-review.json \
            --run-id "github-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --event-name "${GITHUB_EVENT_NAME}" \
            --activation-mode "${V0_5_WEEKLY_ACTIVATION_MODE}" \
            --output online-training/publish-receipt.json

      - name: Assert V0.5 evidence and no-trading boundaries
        if: steps.window.outputs.run_allowed == 'true'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          publish = json.loads(Path("online-training/publish-receipt.json").read_text())
          review = json.loads(Path("online-training/training/weekly-review.json").read_text())
          assert publish["status"] == "PASS"
          assert publish["execution_route"]["event_name"] in {"schedule", "workflow_dispatch"}
          assert publish["r2_writes_performed"] is True
          assert publish["governance_contract"]["status"] == "PASS"
          assert publish["comparison_baseline"]["market_count_requested"] >= 500
          assert publish["comparison_baseline"]["row_count"] > 0
          assert publish["dataset_quality_gate"]["status"] == "PASS"
          assert publish["parquet_contract"]["status"] == "PASS"
          assert publish["model_contract"]["status"] == "PASS"
          assert publish["metrics_contract"]["status"] == "PASS"
          assert publish["weekly_review_contract"]["status"] == "PASS"
          assert review["status"] == "PASS"
          assert review["status_semantics"] == "PIPELINE_EVIDENCE_COMPLETED_NOT_MODEL_APPROVAL"
          assert review["model_quality_gate"]["status"] in {"PASS", "REJECT"}
          assert review["model_quality_gate"]["promotion_eligible"] is False
          assert review["lineage"]["holdout_accessed"] is False
          assert review["authority"]["automatic_model_promotion_authorized"] is False
          assert publish["source_switch_authorized"] is False
          assert publish["automatic_trade_plan_authorized"] is False
          assert publish["real_money_order_authorized"] is False
          assert publish["live_trading_authorized"] is False
          PY

      - name: Upload secret-free weekly evidence
        if: steps.window.outputs.run_allowed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: binance-spot-r2-training-v0-5-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            online-training/dataset/receipt.json
            online-training/training/model.json
            online-training/training/metrics.json
            online-training/training/weekly-review.json
            online-training/publish-receipt.json
          retention-days: 90
          if-no-files-found: error

      - name: Record intentional frozen-window skip
        if: steps.window.outputs.run_allowed != 'true'
        run: |
          echo "V0.5 weekly training skipped before provider and R2 access: ${{ steps.window.outputs.stage }}"

      - name: Remove ephemeral workspace outputs
        if: always()
        run: rm -rf -- online-training
