name: LIT Archive Diagnosis V0.1

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lit-archive-diagnosis-v0-1
  cancel-in-progress: false

jobs:
  diagnose:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Compare bounded public LIT archives
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: "1"
        run: python scripts/diagnose_lit_archive.py
      - name: Preserve aggregate diagnosis
        if: ${{ !cancelled() && hashFiles('lit-diagnosis-output/report.json') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: lit-archive-diagnosis-${{ github.run_id }}
          path: lit-diagnosis-output/report.json
          retention-days: 30
          if-no-files-found: error
