name: Validate V0.6 Render Transport Authority Transition

on:
  pull_request:
    paths:
      - config/provider_equivalence_v0_6_render_transport_authority_transition_v0_1.json
      - research/receipts/2026-08-19-provider-equivalence-v0-6-render-transport-authority-transition.json
      - tests/test_render_transport_authority_transition_v0_6.py
      - .github/workflows/validate-v0-6-render-transport-authority-transition.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install pytest
        run: python -m pip install pytest
      - name: Validate V0.6 transition and predecessor boundaries
        run: >-
          python -m pytest -q
          tests/test_render_transport_authority_transition_v0_6.py
          tests/test_render_free_transport_pass_v0_5.py
          tests/test_render_free_transport_preflight_v0_5.py
