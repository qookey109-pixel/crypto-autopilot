name: Diagnose V0.2 Self-Hosted Mac Binance Transport

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Probe exact Binance USD-M official endpoint — no values, no R2
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python3 - <<'PY'
          import json
          import platform
          import urllib.error
          import urllib.request
          from pathlib import Path

          url = "https://fapi.binance.com/fapi/v1/exchangeInfo"
          request = urllib.request.Request(
              url,
              headers={"User-Agent": "qookey-provider-equivalence-self-hosted-transport-check/0.1"},
          )

          result = {
              "status": "BLOCKED",
              "transport": "github_self_hosted_mac",
              "runner_os": platform.system(),
              "runner_machine": platform.machine(),
              "upstream_url": url,
              "http_status": None,
              "json_ok": False,
              "symbols_array": False,
              "symbol_count": None,
              "increment_values_emitted": False,
              "r2_client_constructed": False,
              "r2_writes_performed": False,
              "holdout_candles_accessed": False,
              "source_switch_authorized": False,
              "live_trading_authorized": False,
          }

          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  raw = response.read(8_000_000)
                  result["http_status"] = int(getattr(response, "status", 200))
                  payload = json.loads(raw.decode("utf-8"))
                  result["json_ok"] = isinstance(payload, dict)
                  symbols = payload.get("symbols") if isinstance(payload, dict) else None
                  result["symbols_array"] = isinstance(symbols, list)
                  result["symbol_count"] = len(symbols) if isinstance(symbols, list) else None
                  if (
                      result["http_status"] == 200
                      and result["json_ok"]
                      and result["symbols_array"]
                      and isinstance(result["symbol_count"], int)
                      and result["symbol_count"] > 0
                  ):
                      result["status"] = "PASS"
          except urllib.error.HTTPError as exc:
              result["http_status"] = int(exc.code)
          except Exception as exc:
              result["error_type"] = type(exc).__name__

          Path("artifacts/self-hosted-mac-binance-transport.json").write_text(
              json.dumps(result, sort_keys=True, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(result, sort_keys=True))

          # Do not fail the job solely because Binance blocks the route;
          # the artifact is the diagnostic result and will be reviewed separately.
          assert result["increment_values_emitted"] is False
          assert result["r2_client_constructed"] is False
          assert result["r2_writes_performed"] is False
          assert result["holdout_candles_accessed"] is False
          assert result["source_switch_authorized"] is False
          assert result["live_trading_authorized"] is False
          PY

      - name: Upload sanitized transport result
        uses: actions/upload-artifact@v4
        with:
          name: v0-2-self-hosted-mac-binance-transport-${{ github.run_id }}
          path: artifacts/self-hosted-mac-binance-transport.json
          retention-days: 7
          if-no-files-found: error
