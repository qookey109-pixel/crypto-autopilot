name: Diagnose V0.2 Self-Hosted Mac Binance Transport — RETIRED

on:
  pull_request:
    paths:
      - ".github/workflows/diagnose-v0-2-self-hosted-mac-binance-transport.yml"
      - "research/receipts/2026-08-19-provider-equivalence-v0-2-self-hosted-mac-transport-pass.json"

permissions:
  contents: read

jobs:
  validate-retired:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Validate frozen historical transport PASS without provider access
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          receipt = json.loads(Path('research/receipts/2026-08-19-provider-equivalence-v0-2-self-hosted-mac-transport-pass.json').read_text())
          assert receipt['status'] == 'PASS'
          assert receipt['execution_evidence']['transport'] == 'github_self_hosted_mac'
          assert receipt['execution_evidence']['http_status'] == 200
          print('RETIRED_NO_EXECUTION')
          print('provider_requests_performed=0')
          print('r2_writes_performed=false')
          print('holdout_candles_accessed=false')
          print('source_switch_authorized=false')
          print('live_trading_authorized=false')
          PY
