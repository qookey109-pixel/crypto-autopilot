name: Pionex Binance Equivalence V0.1 Forensics — RETIRED

on:
  pull_request:
    paths:
      - ".github/workflows/pionex-binance-equivalence-v0-1-forensics.yml"
      - "research/receipts/2026-08-19-pionex-binance-equivalence-v0-1-direction-forensics.json"

permissions:
  contents: read

jobs:
  validate-retired:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Validate frozen direction-forensics authority without R2 replay
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          receipt = json.loads(Path('research/receipts/2026-08-19-pionex-binance-equivalence-v0-1-direction-forensics.json').read_text(encoding='utf-8'))
          assert receipt['status'] == 'PASS'
          assert receipt['stage'] == 'PIONEX_BINANCE_EQUIVALENCE_V0_1_DIRECTION_FORENSICS_PASS'
          assert receipt['authority_type'] == 'DESCRIPTIVE_FORENSIC_EVIDENCE_ONLY'
          assert receipt['frozen_v0_1_gate_status'] == 'FAIL'
          assert receipt['frozen_v0_1_outcome_changed'] is False
          replay = receipt['source_replay']
          assert (replay['v0_1_pair_count_reproduced'], replay['v0_1_pass_count_reproduced'], replay['v0_1_review_count_reproduced'], replay['v0_1_fail_count_reproduced']) == (45, 18, 18, 9)
          assert replay['v0_1_gate_status_reproduced'] == 'FAIL'
          boundary = receipt['authority_boundary']
          assert boundary['v0_1_thresholds_changed'] is False
          assert boundary['v0_1_scope_changed'] is False
          assert boundary['source_switch_authorized'] is False
          assert boundary['live_trading_authorized'] is False
          print('RETIRED_NO_EXECUTION')
          print('provider_requests_performed=0')
          print('r2_client_constructed=false')
          print('r2_reads_performed=false')
          print('r2_writes_performed=false')
          print('holdout_candles_accessed=false')
          print('source_switch_authorized=false')
          print('live_trading_authorized=false')
          PY
