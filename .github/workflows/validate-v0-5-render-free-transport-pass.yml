name: Validate V0.5 Render Free Transport PASS

on:
  pull_request:
    paths:
      - research/receipts/2026-08-19-provider-equivalence-v0-5-render-free-transport-pass.json
      - tests/test_render_free_transport_pass_v0_5.py
      - .github/workflows/validate-v0-5-render-free-transport-pass.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pytest
        run: python -m pip install pytest
      - name: Validate frozen sanitized PASS receipt
        run: python -m pytest -q tests/test_render_free_transport_pass_v0_5.py tests/test_render_free_transport_preflight_v0_5.py
