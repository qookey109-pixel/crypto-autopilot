name: Pionex Alternative Assets Catalog V0.1

on:
  schedule:
    - cron: "53 2 4 9 *"
    - cron: "53 3 6,13,20,27 9 *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pionex-alternative-assets-catalog-v0-1
  cancel-in-progress: false

jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Install constrained runtime
        run: python -m pip install -c requirements/ci-constraints.txt .

      - name: Build and publish metadata-only Pionex catalog
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          python scripts/run_pionex_alternative_assets_catalog.py \
            --config config/pionex_alternative_assets_v0_1.json \
            --authority research/receipts/2026-08-30-pionex-alternative-assets-v0-1-authority.json \
            --run-id "github-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --output alternative-assets-output/report.json

      - name: Assert catalog-only safety boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("alternative-assets-output/report.json").read_text())
          authority = report["authority"]
          assert authority["metadata_only"] is True
          for key, value in authority.items():
              if key != "metadata_only":
                  assert value is False, key
          if report["status"] == "SKIPPED":
              assert report["provider_requests_performed"] == 0
              assert report["r2_access_performed"] is False
              raise SystemExit(0)
          assert report["provider"] == "pionex_public_futures"
          assert report["r2"]["latest_pointer_written_last"] is True
          PY

      - name: Upload secret-free catalog report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pionex-alternative-assets-${{ github.run_id }}-${{ github.run_attempt }}
          path: alternative-assets-output/report.json
          retention-days: 90
          if-no-files-found: error

      - name: Remove disposable runner output
        if: always()
        run: rm -rf alternative-assets-output
