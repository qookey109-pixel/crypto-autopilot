name: Historical Backfill Pilot

on:
  workflow_dispatch:
    inputs:
      year:
        description: "Complete UTC calendar year for the bounded pilot"
        required: true
        default: "2025"

permissions:
  contents: read

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        shard_index: [0, 1, 2]
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: python -m pip install -e .

      - name: Planned interruption proof on shard 0
        if: matrix.shard_index == 0
        shell: bash
        run: |
          set +e
          python scripts/run_historical_backfill_pilot.py \
            --year "${{ inputs.year }}" \
            --shard-index "${{ matrix.shard_index }}" \
            --shard-count 3 \
            --requests-per-second 3 \
            --planned-stop-after-staged 1 \
            --output "artifacts/planned-stop-shard-${{ matrix.shard_index }}.json"
          rc=$?
          set -e
          if [ "$rc" -ne 75 ] && [ "$rc" -ne 0 ]; then
            echo "Unexpected planned-stop exit code: $rc"
            exit "$rc"
          fi
          echo "planned-stop phase exit code: $rc"

      - name: Run or resume bounded one-year pilot shard
        run: |
          python scripts/run_historical_backfill_pilot.py \
            --year "${{ inputs.year }}" \
            --shard-index "${{ matrix.shard_index }}" \
            --shard-count 3 \
            --requests-per-second 3 \
            --output "artifacts/final-shard-${{ matrix.shard_index }}.json"

      - name: Upload shard evidence
        uses: actions/upload-artifact@v4
        with:
          name: historical-backfill-pilot-${{ github.run_id }}-shard-${{ matrix.shard_index }}
          path: artifacts/*.json
          if-no-files-found: error
