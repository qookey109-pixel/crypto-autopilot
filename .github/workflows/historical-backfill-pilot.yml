name: Historical Backfill Pilot — RETIRED

on:
  pull_request:
    paths:
      - ".github/workflows/historical-backfill-pilot.yml"
      - "docs/HISTORICAL_CAPACITY_AND_BACKFILL_V0_1.md"
      - "PROJECT_STATUS.md"

permissions:
  contents: read

jobs:
  validate-retired:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Assert historical pilot cannot execute
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          doc = Path('docs/HISTORICAL_CAPACITY_AND_BACKFILL_V0_1.md').read_text(encoding='utf-8')
          status = Path('PROJECT_STATUS.md').read_text(encoding='utf-8')
          assert 'Long-horizon acquisition has not started.' in doc
          assert 'TRADE-KLINE W1 MATERIALIZATION NOT_AUTHORIZED' in status
          print('RETIRED_NO_EXECUTION')
          print('provider_requests_performed=0')
          print('r2_writes_performed=false')
          print('holdout_candles_accessed=false')
          print('source_switch_authorized=false')
          print('live_trading_authorized=false')
          PY
