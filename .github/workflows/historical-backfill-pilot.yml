name: Historical Backfill Pilot

on:
  workflow_dispatch:
    inputs:
      year:
        description: "Complete UTC calendar year for the bounded pilot"
        required: true
        default: "2025"
  push:
    branches: [main]
    paths:
      - ".github/workflows/historical-backfill-pilot.yml"
      - "scripts/run_historical_backfill_pilot.py"
      - "scripts/aggregate_historical_backfill_pilot.py"
      - "src/crypto_autopilot/historical.py"
      - "src/crypto_autopilot/pilot_evidence.py"
      - "src/crypto_autopilot/storage/historical_backfill.py"
      - "src/crypto_autopilot/storage/layout.py"
      - "src/crypto_autopilot/storage/r2.py"
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: read

concurrency:
  group: historical-backfill-pilot-${{ inputs.year || '2025' }}
  cancel-in-progress: false

env:
  PILOT_YEAR: ${{ inputs.year || '2025' }}

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        shard_index: [0, 1, 2]
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: python -m pip install -e .

      - name: Planned interruption proof on shard 0
        if: matrix.shard_index == 0
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          rc=1
          for attempt in 1 2 3; do
            export PILOT_PROCESS_ATTEMPT="$attempt"
            out="artifacts/planned-stop-shard-${{ matrix.shard_index }}-attempt-${attempt}.json"
            set +e
            python scripts/run_historical_backfill_pilot.py \
              --year "$PILOT_YEAR" \
              --shard-index "${{ matrix.shard_index }}" \
              --shard-count 3 \
              --requests-per-second 3 \
              --planned-stop-after-staged 1 \
              --output "$out"
            rc=$?
            set -e
            cp "$out" "artifacts/planned-stop-shard-${{ matrix.shard_index }}.json"

            if [ "$rc" -eq 75 ] || [ "$rc" -eq 0 ]; then
              echo "planned-stop phase accepted with exit code $rc on attempt $attempt"
              exit 0
            fi
            if [ "$rc" -eq 78 ] || [ "$rc" -eq 79 ]; then
              echo "non-retryable safety failure in planned-stop phase: $rc"
              exit "$rc"
            fi
            if [ "$attempt" -lt 3 ]; then
              delay=$((attempt * 20))
              echo "planned-stop phase failed with $rc; retrying after ${delay}s"
              sleep "$delay"
            fi
          done
          exit "$rc"

      - name: Run or resume bounded one-year pilot shard
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          rc=1
          for attempt in 1 2 3; do
            export PILOT_PROCESS_ATTEMPT="$attempt"
            out="artifacts/final-shard-${{ matrix.shard_index }}-attempt-${attempt}.json"
            set +e
            python scripts/run_historical_backfill_pilot.py \
              --year "$PILOT_YEAR" \
              --shard-index "${{ matrix.shard_index }}" \
              --shard-count 3 \
              --requests-per-second 3 \
              --output "$out"
            rc=$?
            set -e
            cp "$out" "artifacts/final-shard-${{ matrix.shard_index }}.json"

            if [ "$rc" -eq 0 ]; then
              echo "shard completed on attempt $attempt"
              exit 0
            fi
            if [ "$rc" -eq 78 ] || [ "$rc" -eq 79 ]; then
              echo "non-retryable safety failure: $rc"
              exit "$rc"
            fi
            if [ "$attempt" -lt 3 ]; then
              delay=$((attempt * 20))
              echo "shard failed with $rc; checkpoint is preserved; retrying after ${delay}s"
              sleep "$delay"
            fi
          done
          exit "$rc"

      - name: Upload shard evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: historical-backfill-pilot-${{ github.run_id }}-shard-${{ matrix.shard_index }}
          path: artifacts/*.json
          if-no-files-found: warn
          retention-days: 90

  aggregate:
    if: always()
    needs: pilot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: python -m pip install -e .

      - name: Download shard evidence
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: historical-backfill-pilot-${{ github.run_id }}-shard-*
          path: downloaded-evidence
          merge-multiple: true

      - name: Aggregate evidence
        run: |
          python scripts/aggregate_historical_backfill_pilot.py \
            --input-dir downloaded-evidence \
            --year "$PILOT_YEAR" \
            --shard-count 3 \
            --output artifacts/historical-backfill-pilot-${{ github.run_id }}-aggregate.json

      - name: Upload aggregate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: historical-backfill-pilot-${{ github.run_id }}-aggregate
          path: artifacts/*.json
          if-no-files-found: warn
          retention-days: 90
