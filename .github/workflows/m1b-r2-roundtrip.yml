name: M1B R2 Round Trip Proof

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: python -m pip install -e .

      - name: Run real R2 round-trip proof
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python scripts/r2_roundtrip_proof.py | tee artifacts/m1b-r2-roundtrip-receipt.json

      - name: Upload proof receipt
        uses: actions/upload-artifact@v4
        with:
          name: m1b-r2-roundtrip-receipt
          path: artifacts/m1b-r2-roundtrip-receipt.json
          if-no-files-found: error
