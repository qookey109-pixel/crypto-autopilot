name: M1B R2 Round Trip Proof — RETIRED

on:
  pull_request:
    paths:
      - ".github/workflows/m1b-r2-roundtrip.yml"
      - "research/receipts/2026-08-18-m1b-r2.json"

permissions:
  contents: read

jobs:
  validate-retired:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate frozen M1B round-trip evidence without R2 access
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          receipt = json.loads(Path('research/receipts/2026-08-18-m1b-r2.json').read_text())
          assert receipt['status'] == 'PASS'
          assert receipt['validation']['object_r2_sha256_verified'] is True
          assert receipt['validation']['parquet_decode_verified'] is True
          print('RETIRED_NO_EXECUTION')
          print('provider_requests_performed=0')
          print('r2_writes_performed=false')
          print('holdout_candles_accessed=false')
          print('source_switch_authorized=false')
          print('live_trading_authorized=false')
          PY
