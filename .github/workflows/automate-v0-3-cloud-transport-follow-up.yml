name: Retired V0.3 Cloudflare Container Follow-up

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Preserve fail-closed retired state
        run: |
          echo 'status=RETIRED_NO_EXECUTION'
          echo 'reason=Cloudflare Containers require Workers Paid and are forbidden by the project FREE-ONLY policy.'
          echo 'provider_requests_performed=0'
          echo 'r2_writes_performed=false'
          echo 'holdout_candles_accessed=false'
          echo 'source_switch_authorized=false'
          echo 'live_trading_authorized=false'
