name: Core100 Threshold Sweep Replay V0.1

on:
  push:
    branches:
      - codex/core100-reject-diagnosis-20260915
    paths:
      - "research/receipts/2026-09-15-core100-threshold-sweep-one-shot-authority.json"

permissions:
  contents: read

concurrency:
  group: core100-threshold-sweep-replay-v0-1
  cancel-in-progress: false

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Install constrained runtime
        run: python -m pip install -c requirements/ci-constraints.txt .

      - name: Replay exact governed dataset without publishing training
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          mkdir -p threshold-replay-output
          python scripts/run_core100_threshold_replay_v0_1.py \
            --config config/binance_usdm_detailed_history_v0_1_2.json \
            --authority research/receipts/2026-08-29-binance-usdm-crypto-core-100-v0-1-2-authority.json \
            --scope research/receipts/2026-09-15-core100-threshold-sweep-one-shot-authority.json \
            --output threshold-replay-output/report.json

      - name: Assert replay is diagnostic only
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("threshold-replay-output/report.json").read_text())
          assert report["status"] == "PASS"
          assert report["source_dataset_fingerprint"] == "91d5ac26e94fe86d175f2ec6972b648d63851c8727849f92d57f94073e377876"
          assert report["model_quality_gate"]["status"] == "REJECT"
          diagnostics = report["threshold_diagnostics_v0_1"]
          assert diagnostics["status"] == "PASS"
          assert diagnostics["configured_threshold"] == 0.55
          assert diagnostics["diagnostic_only"] is True
          assert diagnostics["quality_gate_changed"] is False
          assert len(diagnostics["folds"]) == 4
          for fold in diagnostics["folds"]:
              assert fold["candidate_thresholds"] == [0.5, 0.51, 0.52, 0.53, 0.54, 0.55]
          assert report["r2_writes_performed"] is False
          assert report["provider_requests_performed"] == 0
          assert report["holdout_accessed"] is False
          assert report["training_publication_performed"] is False
          assert report["automatic_model_promotion_authorized"] is False
          assert report["formal_trade_plan_authorized"] is False
          assert report["real_money_order_authorized"] is False
          assert report["live_trading_authorized"] is False
          PY

      - name: Upload secret-free threshold replay evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: core100-threshold-sweep-replay-${{ github.run_id }}-${{ github.run_attempt }}
          path: threshold-replay-output/report.json
          retention-days: 90
          if-no-files-found: error

      - name: Remove disposable runner output
        if: always()
        run: rm -rf threshold-replay-output
