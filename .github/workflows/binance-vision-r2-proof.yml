name: Binance Vision R2 Proof

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/binance-vision-r2-proof.yml"
      - "scripts/prove_binance_vision_r2.py"
      - "src/crypto_autopilot/binance_vision.py"
      - "src/crypto_autopilot/storage/**"
      - "research/receipts/2026-08-18-binance-vision-live-proof.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/binance-vision-r2-proof.yml"
      - "scripts/prove_binance_vision_r2.py"

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: python -m pip install -e .

      - name: Verify R2 secret names are present
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_ACCOUNT_ID}"
          test -n "${R2_BUCKET_NAME}"
          test -n "${R2_ACCESS_KEY_ID}"
          test -n "${R2_SECRET_ACCESS_KEY}"

      - name: Run Binance Vision to R2 bounded proof
        shell: bash
        run: |
          set -euo pipefail
          python scripts/prove_binance_vision_r2.py \
            --period 2025-01 \
            --symbols BTCUSDT ETHUSDT SOLUSDT \
            --run-id "binance-vision-r2-proof-${GITHUB_RUN_ID}" \
            --output-dir artifacts/binance-vision-r2-proof

      - name: Upload Binance Vision R2 proof evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: binance-vision-r2-proof-${{ github.run_id }}
          path: artifacts/binance-vision-r2-proof/*.json
          if-no-files-found: warn
          retention-days: 90
