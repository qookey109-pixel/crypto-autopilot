name: Binance Vision R2 Proof — RETIRED

on:
  pull_request:
    paths:
      - ".github/workflows/binance-vision-r2-proof.yml"
      - "research/receipts/2026-08-18-binance-vision-r2-proof.json"

permissions:
  contents: read

jobs:
  validate-retired:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Validate frozen R2 proof authority without R2 credentials
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          receipt = json.loads(Path('research/receipts/2026-08-18-binance-vision-r2-proof.json').read_text())
          assert receipt['status'] == 'PASS'
          assert receipt['stage'] == 'BINANCE_VISION_R2_BOUNDED_PROOF_PASS'
          assert receipt['proof_scope']['object_count'] == 3
          print('RETIRED_NO_EXECUTION')
          print('provider_requests_performed=0')
          print('r2_writes_performed=false')
          print('holdout_candles_accessed=false')
          print('source_switch_authorized=false')
          print('live_trading_authorized=false')
          PY
