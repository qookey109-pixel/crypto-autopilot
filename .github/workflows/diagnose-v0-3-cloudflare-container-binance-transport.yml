name: Retired V0.3 Cloudflare Container Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Preserve retired fail-closed authority
        run: |
          echo 'status=RETIRED_NO_EXECUTION'
          echo 'reason=Cloudflare Containers require Workers Paid and are forbidden by FREE-ONLY policy.'
          echo 'upstream_provider_request_performed=false'
          echo 'r2_client_constructed=false'
          echo 'r2_writes_performed=false'
          echo 'holdout_candles_accessed=false'
          echo 'source_switch_authorized=false'
          echo 'live_trading_authorized=false'
