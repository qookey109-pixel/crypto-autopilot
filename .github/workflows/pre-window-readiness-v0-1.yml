name: Pre-Window Readiness V0.1

on:
  pull_request:
    paths:
      - ".github/workflows/pre-window-readiness-v0-1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Assert required GitHub secrets are present without exposing values
        shell: bash
        env:
          HAS_METADATA_RELAY_TOKEN: ${{ secrets.METADATA_RELAY_TOKEN != '' }}
          HAS_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
          HAS_R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME != '' }}
          HAS_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID != '' }}
          HAS_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY != '' }}
        run: |
          set -euo pipefail
          for name in \
            HAS_METADATA_RELAY_TOKEN \
            HAS_CLOUDFLARE_ACCOUNT_ID \
            HAS_R2_BUCKET_NAME \
            HAS_R2_ACCESS_KEY_ID \
            HAS_R2_SECRET_ACCESS_KEY
          do
            if [ "${!name}" != "true" ]; then
              echo "required secret presence check failed: ${name}"
              exit 1
            fi
          done
          echo 'required_secret_presence=PASS'
          echo 'secret_values_emitted=false'

      - name: Verify Render shared-secret handshake without provider or R2 access
        shell: bash
        env:
          METADATA_RELAY_TOKEN: ${{ secrets.METADATA_RELAY_TOKEN }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from urllib.request import Request, urlopen

          token = os.environ.get('METADATA_RELAY_TOKEN')
          if not token:
              raise SystemExit('METADATA_RELAY_TOKEN missing')

          request = Request(
              'https://qookey-binance-transport-v0-5.onrender.com/metadata/auth-check',
              headers={
                  'Authorization': f'Bearer {token}',
                  'Accept': 'application/json',
                  'User-Agent': 'qookey-pre-window-readiness-v0-1/0.1',
              },
          )
          with urlopen(request, timeout=20) as response:
              status = int(getattr(response, 'status', 200))
              payload = json.loads(response.read().decode('utf-8'))

          assert status == 200
          assert payload['status'] == 'PASS'
          assert payload['stage'] == 'V0_8_SHARED_RELAY_SECRET_MATCH_PRECHECK'
          assert payload['shared_secret_match'] is True
          assert payload['provider_requests_performed'] == 0
          assert payload['r2_client_constructed'] is False
          assert payload['r2_writes_performed'] is False
          assert payload['holdout_candles_accessed'] is False
          assert payload['source_switch_performed'] is False
          assert payload['live_trading_performed'] is False

          print(json.dumps({
              'status': 'PASS',
              'required_secret_presence': True,
              'render_shared_secret_match': True,
              'provider_requests_performed': 0,
              'r2_client_constructed': False,
              'r2_writes_performed': False,
              'holdout_candles_accessed': False,
              'secret_values_emitted': False,
              'source_switch_performed': False,
              'live_trading_performed': False,
          }, sort_keys=True))
          PY
