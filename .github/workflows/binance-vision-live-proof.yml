name: Binance Vision Live Proof

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/binance-vision-live-proof.yml"
      - "scripts/prove_binance_vision_source.py"
      - "src/crypto_autopilot/binance_vision.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/binance-vision-live-proof.yml"
      - "scripts/prove_binance_vision_source.py"
      - "src/crypto_autopilot/binance_vision.py"

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: python -m pip install -e .

      - name: Run credential-free Binance Vision proof
        run: |
          python scripts/prove_binance_vision_source.py \
            --period 2025-01 \
            --symbols BTCUSDT ETHUSDT SOLUSDT \
            --output /tmp/binance-vision-live-proof.json

      - name: Upload proof evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: binance-vision-live-proof-${{ github.run_id }}
          path: /tmp/binance-vision-live-proof.json
          if-no-files-found: warn
          retention-days: 90
