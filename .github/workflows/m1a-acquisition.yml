name: M1A Pionex Acquisition — RETIRED

on:
  pull_request:
    paths:
      - ".github/workflows/m1a-acquisition.yml"
      - "research/receipts/2026-08-17-m1a-pionex.json"

permissions:
  contents: read

jobs:
  validate-retired:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Validate frozen M1A authority without Pionex access
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          receipt = json.loads(Path('research/receipts/2026-08-17-m1a-pionex.json').read_text(encoding='utf-8'))
          assert receipt['stage'] == 'M1A_COMPLETE'
          assert receipt['audit']['pass'] is True
          assert receipt['acquisition_summary']['symbol_count'] == 15
          assert receipt['acquisition_summary']['total_candles'] == 13230
          assert receipt['guardrails']['private_api_used'] is False
          assert receipt['guardrails']['live_trading_authorized'] is False
          print('RETIRED_NO_EXECUTION')
          print('provider_requests_performed=0')
          print('r2_client_constructed=false')
          print('r2_reads_performed=false')
          print('r2_writes_performed=false')
          print('holdout_candles_accessed=false')
          print('source_switch_authorized=false')
          print('live_trading_authorized=false')
          PY
