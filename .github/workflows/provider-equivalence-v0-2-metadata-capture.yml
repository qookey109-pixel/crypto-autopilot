name: Provider Equivalence V0.2 Metadata Capture

on:
  pull_request:
    paths:
      - ".github/workflows/provider-equivalence-v0-2-metadata-capture.yml"
      - "scripts/capture_provider_equivalence_v0_2_metadata.py"
      - "src/crypto_autopilot/provider_metadata_capture_v0_2.py"
      - "tests/test_provider_metadata_capture_v0_2.py"
      - "config/provider_equivalence_v0_2_metadata_capture_v0_1.json"
      - "research/receipts/2026-08-19-provider-equivalence-v0-2-forward-metadata-capture-authority.json"
      - "research/receipts/2026-08-19-provider-equivalence-v0-2-transport-blocked.json"

permissions:
  contents: read

jobs:
  validate-suspended-state:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e .
      - name: Unit test metadata capture boundaries
        run: python -m unittest tests.test_provider_metadata_capture_v0_2 -v
      - name: Assert transport blocker suspends execution before window start
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          blocker = json.loads(
              Path('research/receipts/2026-08-19-provider-equivalence-v0-2-transport-blocked.json').read_text()
          )
          assert blocker['status'] == 'PASS'
          assert blocker['stage'] == 'PROVIDER_EQUIVALENCE_V0_2_METADATA_TRANSPORT_BLOCKED_CAPTURE_SUSPENDED'
          fail_safe = blocker['capture_fail_safe']
          assert fail_safe['scheduled_capture_started'] is False
          assert fail_safe['complete_capture_receipts_written'] == 0
          assert fail_safe['scheduled_capture_suspended_before_window_start'] is True
          holdout = blocker['holdout_state']
          assert holdout['state'] == 'SUPERSEDED_UNOPENED_BEFORE_METADATA_CAPTURE_EVIDENCE'
          assert holdout['holdout_candles_accessed'] is False
          assert holdout['holdout_evaluated'] is False
          assert holdout['replacement_holdout_frozen'] is False
          boundary = blocker['authorization_boundary']
          assert boundary['metadata_capture_execution_authorized'] is False
          assert boundary['metadata_only_r2_writes_authorized'] is False
          assert boundary['holdout_candle_access_authorized'] is False
          assert boundary['holdout_evaluation_authorized'] is False
          assert boundary['source_switch_authorized'] is False
          assert boundary['staged_trade_kline_w1_materialization_authorized'] is False
          assert boundary['live_trading_authorized'] is False
          PY

# Scheduled capture and main-push connectivity are intentionally absent while
# the frozen transport blocker is active. A separately versioned transport PASS
# authority must land before any new forward capture window or holdout is frozen.
