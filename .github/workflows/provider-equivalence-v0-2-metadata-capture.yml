name: Provider Equivalence V0.2 Metadata Capture — Retired Scheduled Path

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/provider-equivalence-v0-2-metadata-capture.yml"
      - ".github/workflows/provider-equivalence-v0-10-render-metadata-capture.yml"
      - "config/provider_equivalence_v0_10_final_atomic_cutover_v0_1.json"
      - "research/receipts/2026-08-20-provider-equivalence-v0-10-final-atomic-cutover-authority.json"
      - "config/provider_equivalence_v0_2_metadata_capture_v0_2.json"
      - "research/receipts/2026-08-19-provider-equivalence-v0-2-forward-metadata-capture-authority-v0-2.json"

permissions:
  contents: read

jobs:
  validate-retired-history:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Assert V0.2 history is preserved but scheduled execution is retired
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          old_workflow = Path('.github/workflows/provider-equivalence-v0-2-metadata-capture.yml').read_text().splitlines()
          successor_workflow = Path('.github/workflows/provider-equivalence-v0-10-render-metadata-capture.yml').read_text().splitlines()
          protocol = json.loads(Path('config/provider_equivalence_v0_2_metadata_capture_v0_2.json').read_text())
          old_authority = json.loads(Path('research/receipts/2026-08-19-provider-equivalence-v0-2-forward-metadata-capture-authority-v0-2.json').read_text())
          cutover = json.loads(Path('config/provider_equivalence_v0_10_final_atomic_cutover_v0_1.json').read_text())
          authority = json.loads(Path('research/receipts/2026-08-20-provider-equivalence-v0-10-final-atomic-cutover-authority.json').read_text())

          assert not any(line == '  schedule:' for line in old_workflow)
          assert not any('self-hosted' in line and 'runs-on:' in line for line in old_workflow)
          assert any(line == '  schedule:' for line in successor_workflow)
          assert protocol['metadata_capture_window']['hourly_slot_count'] == 194
          assert old_authority['stage'] == 'PROVIDER_EQUIVALENCE_V0_2_REPLACEMENT_METADATA_CAPTURE_AUTHORIZED'
          assert old_authority['new_frozen_candidate_holdout']['state'] == 'FROZEN_UNOPENED'
          assert cutover['atomic_repository_cutover']['old_schedule_removed_in_same_change'] is True
          assert cutover['atomic_repository_cutover']['successor_schedule_enabled_in_same_change'] is True
          assert cutover['atomic_repository_cutover']['concurrent_old_and_new_capture_paths_authorized'] is False
          assert authority['post_merge_authorization']['old_v0_2_scheduled_execution_authorized'] is False
          assert authority['effectivity']['requires_human_review_before_merge'] is True
          PY

      - name: Record harmless retired-path state
        run: |
          echo 'V0.2 scheduled metadata capture path is retained as historical authority only.'
          echo 'provider_requests_performed=0'
          echo 'r2_writes_performed=false'
          echo 'holdout_candles_accessed=false'
          echo 'source_switch_authorized=false'
          echo 'live_trading_authorized=false'
