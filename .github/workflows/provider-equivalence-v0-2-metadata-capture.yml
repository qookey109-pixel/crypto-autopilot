name: Provider Equivalence V0.2 Metadata Capture

on:
  pull_request:
    paths:
      - ".github/workflows/provider-equivalence-v0-2-metadata-capture.yml"
      - "scripts/capture_provider_equivalence_v0_2_metadata.py"
      - "src/crypto_autopilot/provider_metadata_capture_v0_2.py"
      - "tests/test_provider_metadata_capture_v0_2.py"
      - "config/provider_equivalence_v0_2_metadata_capture_v0_1.json"
      - "research/receipts/2026-08-19-provider-equivalence-v0-2-forward-metadata-capture-authority.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/provider-equivalence-v0-2-metadata-capture.yml"
      - "scripts/capture_provider_equivalence_v0_2_metadata.py"
      - "src/crypto_autopilot/provider_metadata_capture_v0_2.py"
      - "tests/test_provider_metadata_capture_v0_2.py"
  schedule:
    - cron: "17 * * * *"
    - cron: "47 * * * *"

permissions:
  contents: read

concurrency:
  group: provider-equivalence-v0-2-metadata-${{ github.event_name }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e .
      - name: Unit test metadata capture boundaries
        run: python -m unittest tests.test_provider_metadata_capture_v0_2 -v
      - name: Assert holdout candles remain forbidden
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          authority = json.loads(Path('research/receipts/2026-08-19-provider-equivalence-v0-2-forward-metadata-capture-authority.json').read_text())
          blocked = authority['explicitly_not_authorized']
          assert blocked['holdout_candle_access_authorized'] is False
          assert blocked['holdout_evaluation_authorized'] is False
          assert blocked['source_switch_authorized'] is False
          assert blocked['staged_trade_kline_w1_materialization_authorized'] is False
          assert blocked['live_trading_authorized'] is False
          PY

  connectivity-preflight:
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e .
      - name: Public metadata connectivity preflight — no R2
        run: |
          python scripts/capture_provider_equivalence_v0_2_metadata.py \
            --mode connectivity-preflight \
            --output artifacts/provider-metadata-connectivity.json
      - name: Verify no-write preflight boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('artifacts/provider-metadata-connectivity.json').read_text())
          assert payload['status'] == 'PASS'
          assert payload['pionex_selected_symbol_count'] == 15
          assert payload['binance_selected_symbol_count'] == 15
          assert payload['increment_values_emitted'] is False
          assert payload['r2_client_constructed'] is False
          assert payload['r2_writes_performed'] is False
          assert payload['holdout_candles_accessed'] is False
          assert payload['source_switch_authorized'] is False
          assert payload['live_trading_authorized'] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: provider-metadata-connectivity-${{ github.run_id }}
          path: artifacts/provider-metadata-connectivity.json
          retention-days: 30
          if-no-files-found: error

  capture:
    if: github.event_name == 'schedule'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e .
      - name: Verify existing R2 secrets are non-empty
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_ACCOUNT_ID}"
          test -n "${R2_BUCKET_NAME}"
          test -n "${R2_ACCESS_KEY_ID}"
          test -n "${R2_SECRET_ACCESS_KEY}"
      - name: Capture public provider metadata if inside frozen window
        run: |
          python scripts/capture_provider_equivalence_v0_2_metadata.py \
            --mode capture \
            --output artifacts/provider-metadata-capture.json
      - name: Assert capture never touches holdout candles or trading
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('artifacts/provider-metadata-capture.json').read_text())
          assert payload['holdout_candles_accessed'] is False
          if payload['status'] == 'PASS':
              assert payload['object_count'] == 3
              assert payload['postwrite_sha256_verification'] is True
              assert payload['r2_writes_performed'] is True
              assert payload['r2_deletes_performed'] is False
              assert payload['source_switch_authorized'] is False
              assert payload['live_trading_authorized'] is False
          else:
              assert payload['status'] == 'SKIP'
              assert payload['provider_requests_performed'] == 0
              assert payload['r2_writes_performed'] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: provider-metadata-capture-${{ github.run_id }}
          path: artifacts/provider-metadata-capture.json
          retention-days: 30
          if-no-files-found: error
