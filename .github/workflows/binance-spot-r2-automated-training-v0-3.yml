name: Binance Spot R2 Automated Training V0.3 — RETIRED

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-retirement:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Assert V0.3 daily execution is retired in favor of V0.5 governance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          config = json.loads(
              Path("config/binance_spot_r2_training_governance_v0_5.json").read_text()
          )
          assert config["status"] == "R2_ONLY_TRAINING_GOVERNANCE_V0_5_AUTHORIZED_ON_MAIN_MERGE"
          assert config["schedule"]["cron_utc"] == "37 2 * * 0"
          assert config["authority"]["live_trading_authorized"] is False
          PY
