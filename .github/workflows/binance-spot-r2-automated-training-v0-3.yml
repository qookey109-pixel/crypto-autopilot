name: Binance Spot R2 Automated Training V0.3

on:
  schedule:
    - cron: "37 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: binance-spot-r2-automated-training-v0-3
  cancel-in-progress: false

jobs:
  sync-train-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Check frozen holdout boundary before provider or R2 access
        id: window
        run: |
          python scripts/check_binance_spot_training_window.py \
            --config config/binance_spot_r2_automated_training_v0_3.json \
            --github-output "$GITHUB_OUTPUT"

      - name: Install constrained runtime
        if: steps.window.outputs.run_allowed == 'true'
        run: python -m pip install -c requirements/ci-constraints.txt .

      - name: Discover public Binance Spot training catalog
        if: steps.window.outputs.run_allowed == 'true'
        run: |
          python scripts/discover_binance_training_universe.py \
            --output online-training/market-catalog.json \
            --quotes USDT USDC

      - name: Build complete provider-separated daily dataset
        if: steps.window.outputs.run_allowed == 'true'
        run: |
          python scripts/fetch_binance_internal_training.py \
            --catalog online-training/market-catalog.json \
            --output-dir online-training/dataset \
            --requests-per-second 5

      - name: Train deterministic research-only models
        if: steps.window.outputs.run_allowed == 'true'
        run: |
          python scripts/train_binance_spot_daily_models.py \
            --config config/binance_spot_r2_automated_training_v0_3.json \
            --dataset online-training/dataset/binance-spot-internal-training-1d.parquet \
            --model-output online-training/training/model.json \
            --metrics-output online-training/training/metrics.json

      - name: Publish canonical dataset and training run to R2
        if: steps.window.outputs.run_allowed == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          python scripts/publish_binance_spot_training_to_r2.py \
            --config config/binance_spot_r2_automated_training_v0_3.json \
            --catalog online-training/market-catalog.json \
            --dataset online-training/dataset/binance-spot-internal-training-1d.parquet \
            --dataset-receipt online-training/dataset/receipt.json \
            --model online-training/training/model.json \
            --metrics online-training/training/metrics.json \
            --run-id "github-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --output online-training/publish-receipt.json

      - name: Assert online research and no-trading boundaries
        if: steps.window.outputs.run_allowed == 'true'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path("online-training/publish-receipt.json").read_text())
          assert result["status"] == "PASS"
          assert result["r2_writes_performed"] is True
          assert result["source_switch_authorized"] is False
          assert result["automatic_trade_plan_authorized"] is False
          assert result["real_money_order_authorized"] is False
          assert result["live_trading_authorized"] is False
          PY

      - name: Upload secret-free run evidence
        if: steps.window.outputs.run_allowed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: binance-spot-r2-training-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            online-training/dataset/receipt.json
            online-training/training/model.json
            online-training/training/metrics.json
            online-training/publish-receipt.json
          retention-days: 90
          if-no-files-found: error

      - name: Record intentional frozen-window skip
        if: steps.window.outputs.run_allowed != 'true'
        run: |
          echo "Training sync skipped before provider and R2 access: ${{ steps.window.outputs.stage }}"
