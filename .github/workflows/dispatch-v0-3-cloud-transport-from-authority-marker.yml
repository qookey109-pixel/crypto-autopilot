name: Retired V0.3 Cloudflare Container Dispatch

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Preserve retired fail-closed authority
        run: |
          echo 'status=RETIRED_NO_EXECUTION'
          echo 'reason=V0.3 Cloudflare Container path is blocked by FREE-ONLY policy and must not dispatch diagnostics.'
          echo 'workflow_dispatch_to_container_performed=false'
          echo 'provider_requests_performed=0'
          echo 'r2_writes_performed=false'
          echo 'holdout_candles_accessed=false'
          echo 'source_switch_authorized=false'
          echo 'live_trading_authorized=false'
