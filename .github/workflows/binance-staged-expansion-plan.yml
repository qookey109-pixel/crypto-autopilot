name: Binance Staged Expansion Plan

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/binance-staged-expansion-plan.yml"
      - "scripts/plan_binance_staged_expansion.py"
      - "src/crypto_autopilot/binance_expansion_plan.py"
      - "tests/test_binance_expansion_plan.py"
      - "config/binance_staged_expansion_plan_v0_1.json"
      - "research/receipts/2026-08-18-binance-max-coverage-discovery.json"
      - "research/receipts/2026-08-18-binance-observed-r2-budget.json"
      - "research/receipts/2026-08-18-binance-2025-r2-pilot.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/binance-staged-expansion-plan.yml"
      - "scripts/plan_binance_staged_expansion.py"
      - "src/crypto_autopilot/binance_expansion_plan.py"
      - "config/binance_staged_expansion_plan_v0_1.json"

permissions:
  contents: read

concurrency:
  group: binance-staged-expansion-plan-v0-1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: python -m pip install -e .

      - name: Generate read-only staged expansion plan
        run: |
          python scripts/plan_binance_staged_expansion.py \
            --config config/binance_staged_expansion_plan_v0_1.json \
            --output artifacts/binance-staged-expansion-plan.json

      - name: Upload staged expansion planning evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: binance-staged-expansion-plan-${{ github.run_id }}
          path: artifacts/binance-staged-expansion-plan.json
          if-no-files-found: warn
          retention-days: 90
