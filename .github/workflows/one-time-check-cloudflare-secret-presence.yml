name: One-Time Check Cloudflare Secret Presence

on:
  pull_request:
    paths:
      - ".github/workflows/one-time-check-cloudflare-secret-presence.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Report secret presence only
        shell: bash
        run: |
          set -euo pipefail

          if [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "CLOUDFLARE_ACCOUNT_ID=PRESENT"
          else
            echo "CLOUDFLARE_ACCOUNT_ID=MISSING"
          fi

          if [ -n "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "CLOUDFLARE_API_TOKEN=PRESENT"
          else
            echo "CLOUDFLARE_API_TOKEN=MISSING"
          fi

          # No network calls. Secret values are never printed.
