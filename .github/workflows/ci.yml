name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  workflow-static:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install pinned actionlint and verify ShellCheck
        shell: bash
        run: |
          set -euo pipefail
          version="1.7.12"
          archive="actionlint_${version}_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/rhysd/actionlint/releases/download/v${version}/${archive}" \
            --output "${archive}"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  ${archive}" \
            | sha256sum -c -
          tar -xzf "${archive}" actionlint
          sudo install -m 0755 actionlint /usr/local/bin/actionlint
          actionlint -version
          shellcheck --version

      - name: Lint workflows changed by this pull request
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t workflows < <(
            git diff --name-only "${BASE_SHA}" "${HEAD_SHA}" -- \
              '.github/workflows/*.yml' '.github/workflows/*.yaml'
          )
          if (( ${#workflows[@]} == 0 )); then
            echo "No workflow files changed."
            exit 0
          fi
          printf 'Linting workflow: %s\n' "${workflows[@]}"
          actionlint -shellcheck="$(command -v shellcheck)" "${workflows[@]}"

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -c requirements/ci-constraints.txt -e .
      - name: Install lint tool
        run: python -m pip install -c requirements/ci-constraints.txt ruff
      - name: Install test tool
        run: python -m pip install -c requirements/ci-constraints.txt pytest
      - name: Ruff core correctness
        run: ruff check src tests scripts
      - name: Unit test runner compatibility (Python 3.12 only)
        if: ${{ matrix.python-version == '3.12' }}
        run: python -m unittest discover -s tests -v
      - name: Full test suite (pytest)
        run: python -m pytest tests -q
      - name: R2 cost and budget gate
        run: python scripts/check_r2_budget.py
      - name: Observed Binance R2 budget gate
        run: python scripts/check_binance_observed_r2_budget.py
      - name: Build informational quality visibility report
        if: ${{ always() && matrix.python-version == '3.13' }}
        continue-on-error: true
        run: python scripts/quality_visibility.py --output quality-visibility.json
      - name: Upload informational quality visibility report
        if: ${{ always() && matrix.python-version == '3.13' }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: quality-visibility-${{ github.run_id }}-${{ github.run_attempt }}
          path: quality-visibility.json
          retention-days: 30
          if-no-files-found: warn
