name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -c requirements/ci-constraints.txt -e .
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: R2 cost and budget gate
        run: python scripts/check_r2_budget.py
      - name: Observed Binance R2 budget gate
        run: python scripts/check_binance_observed_r2_budget.py
