name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  workflow-static:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install pinned actionlint and verify ShellCheck
        shell: bash
        run: |
          set -euo pipefail
          version="1.7.12"
          archive="actionlint_${version}_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/rhysd/actionlint/releases/download/v${version}/${archive}" \
            --output "${archive}"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  ${archive}" \
            | sha256sum -c -
          tar -xzf "${archive}" actionlint
          sudo install -m 0755 actionlint /usr/local/bin/actionlint
          actionlint -version
          shellcheck --version

      - name: Lint workflows changed by this pull request
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t workflows < <(
            git diff --name-only "${BASE_SHA}" "${HEAD_SHA}" -- \
              '.github/workflows/*.yml' '.github/workflows/*.yaml'
          )
          if (( ${#workflows[@]} == 0 )); then
            echo "No workflow files changed."
            exit 0
          fi
          for workflow in "${workflows[@]}"; do
            echo "Linting workflow: ${workflow}"
            if [[ "${workflow}" == ".github/workflows/dashboard-github-pages.yml" ]] &&
               grep -Fxq '  queue: max' "${workflow}"; then
              # GitHub supports queue:max, but pinned actionlint 1.7.12 predates it.
              # Suppress only that known parser error, for this exact workflow,
              # after ensuring there is exactly one queue key at the root.
              if [[ "$(grep -Ec '^[[:space:]]*queue:' "${workflow}")" != 1 ]]; then
                echo "Pages workflow has an unexpected queue declaration" >&2
                exit 1
              fi
              actionlint \
                -ignore '^unexpected key "queue" for "concurrency" section' \
                -shellcheck="$(command -v shellcheck)" "${workflow}"
            else
              actionlint -shellcheck="$(command -v shellcheck)" "${workflow}"
            fi
          done

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -c requirements/ci-constraints.txt -e .
      - name: Install lint tool
        run: python -m pip install -c requirements/ci-constraints.txt ruff
      - name: Install test tool
        run: python -m pip install -c requirements/ci-constraints.txt pytest
      - name: Ruff core correctness
        run: ruff check src tests scripts

      - name: Validate dashboard static safety contract (Python 3.12 only)
        if: ${{ matrix.python-version == '3.12' }}
        run: python scripts/validate_dashboard_static.py
      - name: Validate Cloud Paper R2 and D1 workflow inventories (Python 3.12 only)
        if: ${{ matrix.python-version == '3.12' }}
        run: python scripts/validate_cloud_paper_r2_writer_inventory.py
      - name: Verify Cloud Paper non-access preflight (Python 3.12 only)
        if: ${{ matrix.python-version == '3.12' }}
        run: |
          python scripts/preflight_cloud_paper_loop_v0_1.py --output cloud-paper-preflight/report.json
          python -c "import json; r=json.load(open('cloud-paper-preflight/report.json')); assert r['status'] == 'DISABLED' and r['external_access']['provider_requests_performed'] == 0 and r['external_access']['r2_access_performed'] is False and r['external_access']['d1_access_performed'] is False"
          rm -rf -- cloud-paper-preflight
      - name: Unit test runner compatibility (Python 3.12 only)
        if: ${{ matrix.python-version == '3.12' }}
        run: python -m unittest discover -s tests -v
      - name: Full test suite (pytest)
        run: python -m pytest tests -q
      - name: Measure synthetic Cloud Paper storage (Python 3.12 only)
        if: ${{ matrix.python-version == '3.12' }}
        run: python scripts/measure_cloud_paper_storage_v0_1.py --output cloud-paper-storage-profile/report.json
      - name: Upload synthetic Cloud Paper storage profile
        if: ${{ matrix.python-version == '3.12' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: cloud-paper-storage-profile-${{ github.run_id }}-${{ github.run_attempt }}
          path: cloud-paper-storage-profile/report.json
          retention-days: 30
          if-no-files-found: error
      - name: Measure synthetic Cloud Paper R2 protocol (Python 3.12 only)
        if: ${{ matrix.python-version == '3.12' }}
        run: |
          python scripts/measure_cloud_paper_r2_protocol_profile_v0_1.py > cloud-paper-r2-protocol-profile.json
      - name: Upload synthetic Cloud Paper R2 protocol profile
        if: ${{ matrix.python-version == '3.12' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: cloud-paper-r2-protocol-profile-${{ github.run_id }}-${{ github.run_attempt }}
          path: cloud-paper-r2-protocol-profile.json
          retention-days: 30
          if-no-files-found: error
      - name: R2 cost and budget gate
        run: python scripts/check_r2_budget.py
      - name: Observed Binance R2 budget gate
        run: python scripts/check_binance_observed_r2_budget.py
      - name: Install informational type visibility tool
        if: ${{ always() && matrix.python-version == '3.13' }}
        continue-on-error: true
        run: python -m pip install "mypy==2.3.1"
      - name: Build informational type visibility report
        if: ${{ always() && matrix.python-version == '3.13' }}
        continue-on-error: true
        run: python scripts/type_visibility.py --output type-visibility.json
      - name: Build informational quality visibility report
        if: ${{ always() && matrix.python-version == '3.13' }}
        continue-on-error: true
        run: python scripts/quality_visibility.py --output quality-visibility.json
      - name: Upload informational quality visibility report
        if: ${{ always() && matrix.python-version == '3.13' }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: quality-visibility-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            quality-visibility.json
            type-visibility.json
          retention-days: 30
          if-no-files-found: warn
