name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -c requirements/ci-constraints.txt -e .
      - name: Install lint tool
        run: python -m pip install -c requirements/ci-constraints.txt ruff
      - name: Install test tool
        run: python -m pip install -c requirements/ci-constraints.txt pytest
      - name: Ruff core correctness
        run: ruff check src tests scripts
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: R2 cost and budget gate
        run: python scripts/check_r2_budget.py
      - name: Observed Binance R2 budget gate
        run: python scripts/check_binance_observed_r2_budget.py
