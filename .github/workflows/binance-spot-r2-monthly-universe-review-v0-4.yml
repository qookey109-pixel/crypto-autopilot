name: Binance Spot R2 Monthly Universe Review V0.4 — RETIRED

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-retirement:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Assert V0.4 monthly execution is retired without provider or R2 access
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          current = json.loads(
              Path("config/binance_spot_r2_training_governance_v0_5.json").read_text()
          )
          assert current["monthly_universe_review"]["schema_version"] == "v0.5"
          assert current["monthly_universe_review"]["cron_utc"] == "37 3 1 * *"
          assert current["authority"]["historical_universe_membership_authorized"] is False
          assert current["authority"]["live_trading_authorized"] is False
          PY
